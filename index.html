<style>
/* Layout: phone-first app shell, one column (max 640px), fixed bottom tab bar, rest timer docked above it.
   Single deliberate dark look: black iron, brushed gold. */
:root{
  --bg:#0b0b0c; --surface:#151517; --surface2:#1d1d20; --line:#2a2a2e;
  --fg:#f2eee5; --muted:#8f8a7e; --gold:#c9a24a; --gold-hi:#e7c66d; --gold-ink:#17130a;
  --ok:#7cc287; --bad:#e5655b;
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:12px; --nav-h:64px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--gold-hi);outline-offset:2px}
.num,.tab{font-variant-numeric:tabular-nums}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px calc(var(--nav-h) + 96px + var(--sab,env(safe-area-inset-bottom,0px)))}
header.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding-block:6px 14px}
/* feine Goldlinie unter dem Kopf, wie in PREPIT (über die ganze Breite) */
.top{position:relative;margin-bottom:14px}.top::after{content:'';position:absolute;left:50%;bottom:0;width:100vw;height:1px;transform:translateX(-50%);background:rgba(201,162,74,.5);pointer-events:none}
.brand{font-family:var(--f-display);font-weight:700;font-size:26px;letter-spacing:.06em;text-transform:uppercase}
.brand b{color:var(--gold)}
.gymmode .store{display:none}
.brand.gym{cursor:pointer;-webkit-user-select:none;user-select:none}.brand .swap{flex:none;margin-left:2px;color:var(--gold);align-self:center}.brand.gym:active{opacity:.7}
.brand .tagline{white-space:nowrap;font-family:var(--f-body);font-size:10px;font-weight:700;letter-spacing:.16em;color:var(--muted);margin-top:4px}
.store{font-size:12px;color:var(--muted)}
h2{font-family:var(--f-display);font-weight:600;font-size:22px;letter-spacing:.03em;text-transform:uppercase;margin:22px 0 10px;text-wrap:balance}
h3{font-family:var(--f-display);font-weight:600;font-size:19px;letter-spacing:.02em;margin:0}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.spread{display:flex;align-items:center;justify-content:space-between;gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.card.tap{cursor:pointer;text-align:left;width:100%;display:block}
.card.tap:hover{border-color:#3a3a40}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:10px;font-weight:700;letter-spacing:.01em}
.btn.gold{background:var(--gold);color:var(--gold-ink)}
.btn.gold:hover{background:var(--gold-hi)}
.btn.ghost{border:1px solid var(--line);background:var(--surface2)}
.btn.ghost:hover{border-color:var(--gold)}
.btn.text{color:var(--gold);min-height:36px;padding:0 6px}
.btn.danger{color:var(--bad);border:1px solid #4a2522;background:transparent}
.btn.full{width:100%}
.btn.sm{min-height:34px;padding:0 12px;font-size:13px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:12px;font-weight:600;color:var(--muted);background:var(--surface2)}
.chip.on{border-color:var(--gold);color:var(--gold)}
.pr{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--gold-ink);background:var(--gold);border-radius:6px;padding:2px 6px;text-transform:uppercase}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:22px 16px;text-align:center;color:var(--muted)}
.empty strong{display:block;color:var(--fg);font-family:var(--f-display);font-size:20px;letter-spacing:.02em;margin-bottom:4px}
.hero{padding:18px;background:linear-gradient(160deg,#1a1710 0%,var(--surface) 55%);border-color:#3a3220}
.hero .big{font-family:var(--f-display);font-size:34px;font-weight:700;line-height:1;letter-spacing:.02em}

/* Active workout */
.wk-head{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.wk-name{background:transparent;border:0;border-bottom:1px solid var(--line);font-family:var(--f-display);font-size:28px;font-weight:700;padding:2px 0;width:100%;letter-spacing:.02em}
.wk-name:focus{outline:none;border-color:var(--gold)}
.timer{font-family:var(--f-display);font-size:20px;color:var(--gold)}
.ex{padding:12px 12px 8px}
.exthumb{width:64px;height:43px;border-radius:8px;object-fit:cover;flex:none;background:#000;border:1px solid var(--line)}
textarea.field{font-family:inherit}
.tcard{display:flex;width:100%;align-items:center;gap:10px;padding:14px 16px;border-radius:14px;border:1px solid var(--line);background:var(--surface2);color:var(--fg);text-align:left;font:inherit;cursor:pointer}.tcard .name{font-weight:800}.tcard:not(.app) .name{color:#cfc9bd}.tcard.app{border-color:var(--gold);background:linear-gradient(135deg,rgba(201,162,74,.16),rgba(201,162,74,.03))}.tcard.app .name{color:var(--gold-hi)}.ttag{display:inline-block;margin-left:8px;font-size:10px;font-weight:800;letter-spacing:.05em;color:var(--gold-ink);background:var(--gold);border-radius:999px;padding:2px 7px;vertical-align:2px}.rvli{cursor:pointer;align-items:center}.rvli .lithumb{width:56px;height:56px}.rcard{cursor:pointer}.rxset{display:flex;gap:6px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}.rxset .field{margin:0;flex:1;min-width:0}
.lithumb{width:54px;height:36px;border-radius:6px;object-fit:cover;flex:none;background:#000;margin-right:10px;border:1px solid var(--line)}
.exhero{width:100%;aspect-ratio:1/1;object-fit:contain;border-radius:12px;display:block;margin:10px 0 6px;background:#000;border:1px solid var(--line)}
.ex-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.ex-head h3{color:var(--gold-hi);min-width:0;overflow-wrap:anywhere;cursor:pointer}
.sets{width:100%;border-collapse:collapse}
.sets th{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600;text-align:center;padding:4px 2px}
.sets td{text-align:center;padding:4px 2px}
.sets tr.restrow td{padding:0 2px}
.setrest{display:flex;align-items:center;gap:10px;width:100%;padding:3px 0;color:var(--gold);font-weight:700;font-size:13px;font-variant-numeric:tabular-nums;background:none;border:0}
.setrest span{flex:1;height:3px;border-radius:2px;background:rgba(201,162,74,.35)}
.nt{width:100%;min-height:38px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font:inherit;font-size:14px;line-height:1.4;padding:8px 10px;resize:vertical}
.nt:focus{outline:none;border-color:var(--gold)}
.ntl{display:flex;justify-content:space-between;align-items:center;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:8px 0 4px}
.ntl.next{color:var(--gold)}
.tgt{display:inline-flex;align-items:center;gap:6px;margin-top:6px;padding:4px 10px;border:1px solid var(--gold);border-radius:999px;font-size:13px;font-weight:700;color:var(--gold-hi)}
.tgt input{width:84px;background:none;border:0;color:var(--gold-hi);font:inherit;font-weight:800;padding:0}
.tgt input:focus{outline:none}
.sets tr.done td{background:rgba(124,194,135,.09)}
.sets tr.done td:first-child{border-radius:8px 0 0 8px}
.sets tr.done td:last-child{border-radius:0 8px 8px 0}
.setno{width:34px;height:32px;border-radius:8px;font-weight:700;background:var(--surface2)}
.setno.w{color:var(--gold);}
.prev{font-size:13px;color:var(--muted);white-space:nowrap}
.cell{width:100%;max-width:84px;height:36px;border-radius:8px;border:1px solid var(--line);background:var(--bg);text-align:center;font-weight:700;font-size:16px;font-variant-numeric:tabular-nums}
.cell.rpe{max-width:58px;padding:0 2px;font-size:15px;-webkit-appearance:none;appearance:none;text-align-last:center;color:var(--gold-hi)}
.cell:focus{outline:none;border-color:var(--gold)}
.cell::placeholder{color:#5a5750;font-weight:600}
.rcell{position:relative;display:inline-block;width:100%;max-width:84px}
.rpeb{position:absolute;top:-9px;right:-6px;min-width:26px;height:20px;padding:0 5px;border-radius:10px;font-size:11px;font-weight:800;line-height:20px;background:var(--gold);color:var(--gold-ink);border:0;font-variant-numeric:tabular-nums;z-index:2}
.rpeb.empty{background:var(--surface2);color:var(--muted);border:1px solid var(--line);font-weight:700}
.rpegrid{display:grid;grid-template-columns:repeat(9,1fr);gap:4px;margin-top:14px}
.rpegrid button{height:46px;border-radius:8px;background:var(--surface2);color:var(--fg);font-weight:800;border:1px solid var(--line);font-size:15px}
.rpegrid button.on{background:var(--gold);color:var(--gold-ink);border-color:var(--gold)}
.rpetxt{min-height:44px;margin-top:14px;text-align:center;color:var(--muted);font-size:15px}
.sdel{display:none;height:34px;padding:0 10px;border-radius:8px;background:var(--bad);color:#fff;font-weight:800;border:0;font-size:13px}
tr.swiped .sdel{display:inline-block}tr.swiped .check{display:none}
tr.swiped td{background:rgba(220,80,80,.08)}
.check.half svg{display:none}
.check.half{background:rgba(201,162,74,.25);border-color:var(--gold);color:var(--gold-hi);font-weight:800;font-size:13px}
.activebar{display:flex;align-items:center;justify-content:space-between;width:100%;margin-bottom:12px;padding:12px 14px;border-radius:14px;border:1px solid var(--gold);background:rgba(201,162,74,.12);color:var(--gold-hi);font-weight:800}
.nt{overflow:hidden;resize:none}
.gear{display:inline-flex;align-items:center;gap:6px;margin:6px 0 0 6px;padding:4px 10px;border:1px solid var(--line);border-radius:999px;font-size:13px;font-weight:700;color:var(--fg);background:var(--surface2);max-width:100%;text-align:left}
.gear svg{width:14px;height:14px;stroke:var(--gold);fill:none;stroke-width:2;flex:none}
.gear.empty{color:var(--muted);font-weight:600}
.geargrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.geargrid label{display:flex;flex-direction:column;gap:4px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.restbar .in{gap:6px}.restbar .btn.sm{padding:0 9px}
.rgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rcard{display:flex;flex-direction:column;gap:6px;padding:12px;min-width:0}
.rcard h3{font-size:16px;line-height:1.2;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere;margin:0}
.rcard .rfoot{margin-top:auto;display:flex;gap:6px;align-items:center}
.rcard .rfoot .btn.gold{flex:1;padding:0 8px}
.rcard{position:relative}.rtop{display:flex;align-items:center;gap:8px}
.rbadge{flex:none;min-width:30px;height:30px;padding:0 8px;border-radius:15px;background:var(--surface2);border:1px solid var(--line);color:var(--gold-hi);font-weight:800;font-size:13px;display:inline-flex;align-items:center;justify-content:center;font-family:inherit}
button.rbadge{cursor:pointer}
.rcard.next{border-color:rgba(201,162,74,.75);box-shadow:0 0 0 1px rgba(201,162,74,.25),0 0 22px rgba(201,162,74,.22)}
.rcard.next .rbadge{background:var(--gold);color:var(--gold-ink);border-color:var(--gold)}
.effb{display:flex;gap:12px;align-items:center;width:100%;padding:12px 14px;border-radius:14px;background:var(--surface2);border:1px solid var(--line);color:var(--fg);font:inherit;font-size:15px;cursor:pointer}
.effb.on{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}
.effn{flex:none;width:34px;height:34px;border-radius:17px;background:var(--surface);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--gold-hi)}
.effb.on .effn{background:#0b0b0c;border:2px solid var(--gold)}
.effs{display:inline-block;min-width:15px;height:15px;line-height:15px;padding:0 3px;margin-left:3px;border-radius:4px;font-size:10px;font-weight:800;text-align:center;vertical-align:super;border:1px solid}
.effs.e1{color:var(--ok);border-color:rgba(124,194,135,.6);background:rgba(124,194,135,.12)}.effs.e2{color:var(--gold-hi);border-color:rgba(201,162,74,.6);background:rgba(201,162,74,.12)}.effs.e3{color:#f0a35a;border-color:rgba(240,163,90,.6);background:rgba(240,163,90,.12)}.effs.e4{color:var(--bad);border-color:rgba(229,101,91,.6);background:rgba(229,101,91,.12)}
.exmeta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:flex-start;margin:-2px 0 4px}.exmeta .tgt,.exmeta .gear{margin:0}
.lbox{position:fixed;inset:0;z-index:999;background:rgba(0,0,0,.94);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:env(safe-area-inset-top) 0 var(--sab,env(safe-area-inset-bottom,0px))}.lbox img{max-width:100%;max-height:88vh;object-fit:contain}.lbox span{color:var(--muted);font-size:12px}
.card.ex.ss{border-left:3px solid var(--gold)}.card.ex.warm{border-left:3px solid #4fa3c7}.card.ex.warm.ss{border-left-color:var(--gold)}.tagrow{display:flex;gap:10px;align-items:center;margin:-4px 0 6px}.tagrow .sstag{margin:0}.wtag{font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#6cc0e3}.rtag{font-size:9.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;margin-left:6px;padding:1px 5px;border-radius:5px;vertical-align:2px}.rtag.w{color:#6cc0e3;border:1px solid #2f6f8a}.rtag.s{color:var(--gold);border:1px solid #6b5626}.sstag{font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);margin:-4px 0 6px}
.pgoal{font-size:11px;font-weight:800;color:var(--gold-hi);margin-top:2px}.pgoal.up{color:var(--ok)}
.pohint{margin-top:8px;font-size:13px;line-height:1.4;padding:8px 10px;border-radius:10px;background:rgba(201,162,74,.08);border:1px solid rgba(201,162,74,.35)}
.pohint b{color:var(--gold-hi)}.pohint.up{background:rgba(124,194,135,.10);border-color:rgba(124,194,135,.5)}.pohint.up b{color:var(--ok)}
.ladder{display:flex;flex-direction:column;gap:6px;margin:12px 0}
.lad{display:grid;grid-template-columns:70px 1fr;gap:8px;align-items:center;font-size:13px}
.lad i{display:flex;align-items:center;height:28px;border-radius:8px;background:var(--surface2);border:1px solid var(--line);padding:0 10px;font-style:normal;font-weight:700;white-space:nowrap}
.lad i.g{background:rgba(201,162,74,.18);border-color:rgba(201,162,74,.6)}.lad i.o{background:rgba(124,194,135,.15);border-color:rgba(124,194,135,.6)}
.dots{display:flex;gap:6px;justify-content:center;margin:14px 0 10px}.dots span{width:8px;height:8px;border-radius:4px;background:var(--line)}.dots span.on{background:var(--gold);width:22px}
.nexttag{white-space:nowrap;font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}
.vtag{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--gold-ink);background:var(--gold);border-radius:6px;padding:2px 6px;vertical-align:middle;margin-left:4px}
.howto{font-size:14px;line-height:1.5;margin:4px 0 10px}
.exsep{display:flex;align-items:center;gap:10px;margin:22px 2px 14px;color:var(--muted);font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:700}
.exsep::before,.exsep::after{content:"";flex:1;height:1px;background:var(--line)}
.card.ex.cur{border-color:rgba(201,162,74,.75);box-shadow:0 0 0 1px rgba(201,162,74,.25),0 0 22px rgba(201,162,74,.22)}
details.oldnotes summary{cursor:pointer;color:var(--gold);font-weight:700;font-size:13px;list-style:none;padding:6px 0}
details.oldnotes summary::-webkit-details-marker{display:none}
.notecard{background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.orderli{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.notehist .nh{padding:10px 0;border-bottom:1px solid var(--line)}
.check{width:38px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--surface2);display:grid;place-items:center}
.check svg{width:18px;height:18px;stroke:var(--muted)}
tr.done .check{background:var(--ok);border-color:var(--ok)}
tr.done .check svg{stroke:#0d1a10}

/* Rest bar + nav */
.restbar{position:fixed;left:0;right:0;bottom:calc(var(--nav-h) + var(--sab,env(safe-area-inset-bottom,0px)));z-index:20;padding:8px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));background:#14120c;border-top:1px solid #3a3220}
.restbar .in{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:10px}
.restbar .t{font-family:var(--f-display);font-size:30px;font-weight:700;color:var(--gold-hi);min-width:78px}
.restbar .bar{flex:1;height:6px;border-radius:3px;background:var(--line);overflow:hidden;min-width:40px}
.restbar .bar i{display:block;height:100%;background:var(--gold)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:21;background:rgba(11,11,12,.96);border-top:1px solid var(--line);padding:0 max(6px,env(safe-area-inset-right,0px)) var(--sab,env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px));backdrop-filter:blur(8px)}
nav.tabs .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:var(--nav-h)}
nav.tabs button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:600;color:var(--muted)}
nav.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}
nav.tabs button.on{color:var(--gold)}

/* Sheet */
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:40}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-height:88%;overflow:auto;background:var(--surface);border-top:1px solid #3a3220;border-radius:18px 18px 0 0;padding:8px max(16px,env(safe-area-inset-right,0px)) calc(20px + var(--sab,env(safe-area-inset-bottom,0px))) max(16px,env(safe-area-inset-left,0px))}
.sheet .in{max-width:640px;margin:0 auto}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 12px}
.sheet h2{margin-top:4px}
.field{width:100%;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--bg);padding:0 12px}
.field:focus{outline:none;border-color:var(--gold)}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 4px;border-bottom:1px solid var(--line);text-align:left;width:100%}
.li:hover{background:var(--surface2)}
.li .name{font-weight:600;min-width:0;overflow-wrap:anywhere}
.cats{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin:10px 0}
.cats::-webkit-scrollbar{display:none}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}

/* ---------- Übungsbibliothek ---------- */

['Kniebeuge','Beine'],['Frontkniebeuge','Beine'],['Beinpresse','Beine'],['Hackenschmidt','Beine'],['Rumänisches Kreuzheben','Beine'],['Ausfallschritte','Beine'],['Bulgarian Split Squat','Beine'],['Step-ups','Beine'],['Beinstrecker','Beine'],['Beinbeuger liegend','Beine'],['Beinbeuger sitzend','Beine'],['Hip Thrust','Beine'],['Abduktoren (Maschine)','Beine'],['Adduktoren (Maschine)','Beine'],['Wadenheben stehend','Beine'],['Wadenheben sitzend','Beine'],
['Langhantelcurls','Arme'],['Kurzhantelcurls','Arme'],['Hammercurls','Arme'],['Kabelcurls','Arme'],['Kabelcurls einarmig','Arme'],['Scottcurls','Arme'],['Trizepsdrücken am Kabel','Arme'],['French Press','Arme'],['Enges Bankdrücken','Arme'],['Überkopf-Trizeps (Kabel)','Arme'],
['Plank (Sek.)','Core'],['Hängendes Beinheben','Core'],['Cable Crunch','Core'],['Ab Wheel','Core'],['Dragon Flag','Core'],['Russian Twists','Core'],['Pallof Press','Core'],
['Power Clean','Athletik'],['Kettlebell Swing','Athletik'],['Box Jumps','Athletik'],['Broad Jumps','Athletik'],['Sled Push','Athletik'],['Medizinball-Wurf','Athletik'],['Sprints (m)','Athletik'],['Farmer\'s Walk','Athletik'],['Sprawl','Athletik'],['Double-Leg-Shot (Ringen)','Athletik'],['Ringerbrücke','Athletik'],['Kip-up','Athletik'],['Technical Stand-up','Athletik'],['Hip Escape (Shrimp)','Athletik'],['Sit-out (Ringen)','Athletik'],['Schattenboxen (Sek.)','Athletik'],['Boxsack (Sek.)','Athletik'],['Seilspringen (Sek.)','Athletik'],['Burpees','Athletik']
];

/* ---------- State ---------- */
const S={ready:false,mode:'local',routines:[],custom:[],workouts:[],body:[],active:null,tab:'training',rest:null,restDefault:90,sheet:null,exq:'',pq:'',pcat:'',edit:null,canPhotos:false,gear:{},goal:null,rfolder:'mine'};
let refs=null,assets=null,downloads=null;
const $=s=>document.querySelector(s);
const clone=o=>JSON.parse(JSON.stringify(o));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nf=new Intl.NumberFormat('de-CH',{maximumFractionDigits:1});
const fmt=n=>nf.format(Math.round((n||0)*10)/10);
const num=v=>{const n=parseFloat(String(v??'').replace(',','.'));return isFinite(n)?n:0};
const e1rm=(kg,r)=>r<=0?0:(r===1?kg:kg*(1+r/30));
const mmss=s=>{s=Math.max(0,Math.round(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
const dur=ms=>{const m=Math.round(ms/60000);return m>=60?Math.floor(m/60)+' h '+(m%60)+' min':m+' min'};
const dayKey=(t=Date.now())=>{const d=new Date(t);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const fDate=t=>new Date(t).toLocaleDateString('de-CH',{weekday:'short',day:'numeric',month:'short'});
const fDay=k=>new Date(k+'T12:00').toLocaleDateString('de-CH',{weekday:'short',day:'numeric',month:'short',year:'numeric'});
const catOf=n=>(LIB.find(x=>x[0]===n)||S.custom.find(x=>x[0]===n)||LIB.find(x=>x[0]===baseName(n))||S.custom.find(x=>x[0]===baseName(n))||[])[1]||'Eigene';

/* ---------- Speicherung ---------- */
const LS='hantelbuch.v1';
function lsLoad(){try{return JSON.parse(localStorage.getItem(LS))||{}}catch(e){return{}}}
function lsSave(){if(refs)return;try{localStorage.setItem(LS,JSON.stringify({routines:S.routines,custom:S.custom,seeded:S.seeded||[],tpls:S.tpls||[],gear:S.gear||{},goal:S.goal||null,workouts:S.workouts,body:S.body.map(b=>({...b,photos:(b.photos||[]).filter(p=>String(p.id).startsWith('local-'))})),active:S.active,restDefault:S.restDefault}))}catch(e){}}
const queues={};
function q(key,fn){const p=(queues[key]||Promise.resolve()).then(fn).catch(e=>{console.warn(e);toast(e&&e.code==='quota_exceeded'?'Speicher voll. Lösche alte Einträge.':'Speichern fehlgeschlagen. Prüfe deine Verbindung.')});queues[key]=p;return p}
function saveMeta(){if(refs){const d=clone({routines:S.routines,tpls:S.tpls||[],custom:S.custom,gear:S.gear||{},goal:S.goal||null,restDefault:S.restDefault,seeded:S.seeded||[],soundId:S.soundId||null,soundRaw:!!S.soundRaw});q('meta',()=>refs.meta.set(d))}else lsSave()}
let actT;function saveActive(now){clearTimeout(actT);const go=()=>{if(refs){const a=S.active?clone(S.active):null;q('active',()=>a?refs.active.set({w:a}):refs.active.delete())}else lsSave()};now?go():actT=setTimeout(go,600)}
function saveWorkout(w){if(refs){const d=clone(w);return q('w'+w.id,()=>refs.workouts.doc(w.id).set(d))}lsSave();return Promise.resolve()}
function delWorkout(id){S.workouts=S.workouts.filter(w=>w.id!==id);if(refs)q('w'+id,()=>refs.workouts.doc(id).delete());else lsSave()}
function sDay({date}){const b=S.body.find(x=>x.date===date)||{date,photos:[]};const ws=S.workouts.filter(w=>dayKey(w.start)===date);
 return `<div class="eyebrow">Tag</div><div class="spread"><h2 style="margin-top:2px">${fDay(date)}</h2><span class="num" style="font-size:20px;font-weight:800;color:var(--gold-hi)">${b.weight?fmt(b.weight)+' kg':''}</span></div>
 <div class="eyebrow" style="margin:12px 0 6px">Tagesnotiz</div><textarea class="nt" data-in="daynote" data-d="${date}" rows="3" placeholder="Wie ging’s dir? Schlaf, Essen, Energie …">${esc(b.note||'')}</textarea>
 ${ws.length?`<div class="eyebrow" style="margin:14px 0 6px">Training an diesem Tag</div><div class="list">${ws.map(w=>`<button class="li" data-act="w-open" data-v="${w.id}"><span style="text-align:left"><span class="name">${esc(w.name)}</span>${w.note?`<br><span class="muted mini" style="white-space:pre-line">${esc(w.note)}</span>`:''}</span><span class="muted">›</span></button>`).join('')}</div>`:''}
 <div class="eyebrow" style="margin:14px 0 6px">Form-Check</div>
 ${b.photos&&b.photos.length?`<div class="stack">${b.photos.map(p=>`<div style="position:relative"><img ${phSrc(p)} alt="Form-Check vom ${fDay(date)}" data-act="ph-big" style="width:100%;border-radius:12px;display:block;background:var(--surface2);cursor:zoom-in"><button class="btn sm" data-act="ph-del" data-d="${date}" data-v="${esc(p.id)}" style="position:absolute;top:8px;right:8px;background:rgba(0,0,0,.65);color:#fff;border:1px solid rgba(255,255,255,.25)">Löschen</button></div>`).join('')}</div>`:'<div class="muted mini">Noch kein Foto an diesem Tag.</div>'}
 ${S.canPhotos?`<button class="btn ghost full" style="margin-top:10px" data-act="day-photo" data-v="${date}">+ Foto für diesen Tag</button>`:''}`}
async function idbDel(k){try{const d=await idb();return new Promise(res=>{const t=d.transaction('kv','readwrite');t.objectStore('kv').delete(k);t.oncomplete=res;t.onerror=res})}catch(e){}}
function saveBody(b){const i=S.body.findIndex(x=>x.date===b.date);if(i>=0)S.body[i]=b;else S.body.push(b);S.body.sort((a,c)=>c.date.localeCompare(a.date));if(refs){const d=clone(b);return q('b'+b.date,()=>refs.body.doc(b.date).set(d))}lsSave();return Promise.resolve()}

let pendingRender=false;
function soft(){const a=document.activeElement;if(a&&a.matches&&a.matches('#main input, #main textarea, #main select')){pendingRender=true;return}renderMain()}
document.addEventListener('focusout',()=>{if(pendingRender){pendingRender=false;setTimeout(renderMain,0)}});

async function init(){
  renderNav();
  let d=null,u=null;
  try{if(window.claude&&claude.use){[d,u,assets,downloads]=await Promise.all([claude.use('db'),claude.use('user'),claude.use('assets'),claude.use('downloads')])}}catch(e){}
  let id=null;try{id=u?await u.id():null}catch(e){}
  if(d&&id){
    S.mode='cloud';S.canPhotos=!!assets;
    const base='data/users/'+id;const meta=d.doc(base+'/app');
    refs={meta,active:d.doc(base+'/active'),workouts:meta.collection('workouts'),body:meta.collection('body')};
    let n=0;const ready=()=>{if(++n===3){S.ready=true;renderAll()}};
    let m1=false,m2=false,m3=false;
    meta.onSnapshot(s=>{const v=s.data()||{};S.routines=clone(v.routines||[]);S.tpls=clone(v.tpls||[]);S.custom=clone(v.custom||[]);S.gear=clone(v.gear||{});S.goal=v.goal||null;if(v.restDefault)S.restDefault=v.restDefault;S.seeded=v.seeded||[];if(v.soundId!==S.soundId){S.soundId=v.soundId||null;S.soundRaw=!!v.soundRaw;customBuf=null;if(rawEl){rawEl.remove();rawEl=null}if(S.soundRaw)loadRaw()}if(!m1){m1=true;seedRoutines();ready()}else soft()},fail);
    refs.workouts.orderBy('start','desc').limit(1000).onSnapshot(s=>{S.workouts=s.docs.map(x=>x.data());if(!m2){m2=true;ready()}else soft()},fail);
    refs.body.orderBy('date','desc').limit(1000).onSnapshot(s=>{S.body=s.docs.map(x=>clone(x.data()));if(!m3){m3=true;ready()}else soft()},fail);
    try{const a=await refs.active.get();if(a.exists&&a.data().w)S.active=clone(a.data().w)}catch(e){}
    if(S.ready)renderAll();
  }else{
    const v=lsLoad();Object.assign(S,{routines:v.routines||[],tpls:v.tpls||[],custom:v.custom||[],workouts:v.workouts||[],body:v.body||[],active:v.active||null,restDefault:v.restDefault||90,seeded:v.seeded||[],gear:v.gear||{},goal:v.goal||null,ready:true,canPhotos:true});
    seedRoutines();renderAll();
  }
  $('#store').textContent=S.mode==='cloud'?'In deinem Konto gespeichert':'Nur auf diesem Gerät gespeichert';
}
function fail(e){console.warn(e);if(!S.ready){S.ready=true;renderAll()}toast('Verbindung zum Speicher unterbrochen. Lade die Seite neu.')}

/* ---------- Auswertung ---------- */
function doneSets(ex){return (ex.sets||[]).filter(s=>s.done&&s.type!=='w')}
function wVolume(w){return w.exercises.reduce((a,e)=>a+doneSets(e).reduce((b,s)=>b+num(s.kg)*num(s.reps),0),0)}
function wSets(w){return w.exercises.reduce((a,e)=>a+doneSets(e).length,0)}
function bestSet(ex){let b=null;for(const s of doneSets(ex)){const v=e1rm(num(s.kg),num(s.reps));if(!b||v>b.v||(v===b.v&&num(s.kg)>num(b.s.kg)))b={s,v}}return b&&b.s}
function prevFor(name){for(const w of S.workouts){if(S.active&&S.active.editOf===w.id)continue;const e=w.exercises.find(x=>x.name===name);if(e&&e.sets.some(s=>s.done))return e.sets.filter(s=>s.done)}return null}
function bests(name,skipId){const r={kg:0,e1:0,vol:0,reps:0};for(const w of S.workouts){if(w.id===skipId)continue;const e=w.exercises.find(x=>x.name===name);if(!e)continue;for(const s of doneSets(e)){const kg=num(s.kg),rp=num(s.reps);r.kg=Math.max(r.kg,kg);r.e1=Math.max(r.e1,e1rm(kg,rp));r.vol=Math.max(r.vol,kg*rp);r.reps=Math.max(r.reps,rp)}}return r}
function sessions(name){const out=[];for(const w of S.workouts){const e=w.exercises.find(x=>x.name===name);if(e&&doneSets(e).length)out.push({w,e})}return out}
function ago(t){const d=Math.round((new Date(dayKey()+'T12:00')-new Date(dayKey(t)+'T12:00'))/864e5);return d<=0?'heute':d===1?'gestern':d<14?'vor '+d+' Tagen':d<60?'vor '+Math.round(d/7)+' Wochen':'vor '+Math.round(d/30)+' Monaten'}
function lastEx(name){const s=sessions(name)[0];return s?s.w.start:null}
function lastRoutine(r){const w=S.workouts.find(w=>w.routineId===r.id||w.name===r.name);return w?w.start:null}
function allNames(){const set=new Set([...LIB.map(x=>x[0]),...S.custom.map(x=>x[0])]);for(const w of S.workouts)for(const e of w.exercises)set.add(e.name);return [...set]}

let _hashChecked=false;
function _afterRender(){if(document.querySelector('img[data-lph]'))hydratePhotos()}
function renderAll(){if(!_hashChecked&&S.ready){_hashChecked=true;checkPlanHash()}if(!S.sheet&&!genderSet())S.sheet={type:'gender'};else if(!S.sheet&&S.ready!==false&&!introSeen()){S.introStep=0;S.sheet={type:'intro'};try{localStorage.setItem('hantelbuch.intro','1')}catch(e){}}renderNav();renderMain();renderSheet();renderRest()}
function sGender(){return `<h2>Willkommen</h2><p class="muted" style="margin:4px 0 14px">Wer trainiert? Danach zeigen dir die Übungsbilder einen Mann oder eine Frau. Ändern kannst du das jederzeit unter Verlauf → Daten.</p><div class="stack"><button class="btn gold full" data-act="gender" data-v="m">Mann</button><button class="btn gold full" data-act="gender" data-v="w">Frau</button></div>`}
function renderMain(){
  if(!S.ready)return;
  const m=$('#main');
  m.innerHTML=(S.active&&S.tab!=='training'?`<button class="activebar" data-act="tab" data-v="training"><span>● Training läuft: ${esc(S.active.name)}</span><span>Zurück →</span></button>`:'')+({training:vTraining,routinen:vRoutines,verlauf:vHistory,uebungen:vExercises,koerper:vBody})[S.tab]();
  growAll(m);_afterRender();
  if(S.tab==='training'&&S.active)tick();
}

const WD=['Mo','Di','Mi','Do','Fr','Sa','So'];
function rLabel(){if(!S.rlabel){try{S.rlabel=localStorage.getItem('hantelbuch.rlabel')}catch(e){}}return S.rlabel||'num'}
function nextRid(list){if(!list||list.length<2)return list&&list[0]?list[0].id:null;const ids=list.map(r=>r.id);const w=S.workouts.find(w=>ids.includes(w.routineId));if(!w)return list[0].id;return ids[(ids.indexOf(w.routineId)+1)%ids.length]}
function routineCard(r,i,list){const lt=lastRoutine(r);const day=rLabel()==='day';const today=WD[(new Date().getDay()+6)%7];const isNext=Array.isArray(list)&&r.folder!=='coach'&&(day&&list.some(x=>x.day)?r.day===today:nextRid(list)===r.id);
 const badge=Array.isArray(list)?(day?`<button class="rbadge" data-act="r-day" data-v="${r.id}" aria-label="Wochentag wählen">${r.day?esc(r.day):'+ Tag'}</button>`:`<span class="rbadge">${i+1}</span>`):'';
 return `<div class="card rcard${isNext?' next':''}" data-act="r-view" data-v="${r.id}"><div class="rtop">${badge}${isNext?`<span class="nexttag">${day&&list.some(x=>x.day)?'Heute':'Als Nächstes'}</span>`:''}${r.week?`<span class="muted mini" style="margin-left:auto;font-weight:800">${r.week}</span>`:''}</div><h3>${esc(r.name)}</h3><div class="mini" style="color:${lt?'var(--gold)':'var(--muted)'}">${lt?'Zuletzt '+ago(lt):'Noch nie gemacht'}</div><div class="muted mini">${r.exercises.length} Übungen</div><div class="rfoot"><button class="btn gold sm" data-act="start-r" data-v="${r.id}">Start</button><button class="btn ghost sm" data-act="r-edit" data-v="${r.id}" aria-label="Routine bearbeiten">✎</button></div></div>`}
function routineCardOld(r){const lt=lastRoutine(r);return `<div class="card"><div class="spread"><h3>${esc(r.name)}</h3><button class="btn text sm" data-act="r-edit" data-v="${r.id}">Bearbeiten</button></div>
<div class="mini" style="margin-top:2px;color:${lt?'var(--gold)':'var(--muted)'}">${lt?'Zuletzt '+ago(lt)+' · '+fDate(lt):'Noch nie gemacht'}</div>
<div class="muted mini" style="margin:6px 0 12px">${r.exercises.map(e=>`${e.sets} × ${esc(e.name)}${(e.target||TARGETS[e.name])?` <span style="color:var(--gold)">x${esc(String(e.target||TARGETS[e.name]).replace(/^x/i,''))}</span>`:''}`).join(' · ')||'Noch keine Übungen'}</div>
<button class="btn gold full" data-act="start-r" data-v="${r.id}">Routine starten</button></div>`}

function vTraining(){
  if(S.active)return vActive();
  const last=S.workouts[0];
  const wk=S.workouts.filter(w=>w.start>Date.now()-7*864e5).length;
  return `<div class="card hero stack"><div class="eyebrow">Diese Woche</div><div class="big num">${wk} ${wk===1?'Training':'Trainings'}</div>
  ${last?`<div class="muted mini">Zuletzt: ${esc(last.name)}, ${fDate(last.start)} · ${fmt(wVolume(last))} kg Volumen</div>`:'<div class="muted mini">Starte dein erstes Training. Jeder Satz wird gespeichert.</div>'}
  <button class="btn gold full" data-act="start-empty">Leeres Training starten</button><div class="row" style="justify-content:center;gap:4px;flex-wrap:wrap"><button class="btn text sm" data-act="intro-open">So funktioniert REPIT →</button><button class="btn text sm" data-act="guide">Alle Funktionen →</button></div></div>
  <div class="spread"><h2>Routinen</h2>${S.routines.filter(r=>r.folder!=='coach').length>1?'<button class="btn text sm" data-act="ro-open">Reihenfolge</button>':''}</div>
  ${weekBar()}${S.routines.filter(r=>r.folder!=='coach').length?`<div class="rgrid">${weekFilter(S.routines.filter(r=>r.folder!=='coach')).map(routineCard).join('')}</div>`:emptyRoutines()}
  <div class="sep"></div>
  <div class="spread mini"><span class="muted">Standard-Pause</span><button class="chip on" data-act="rest-default">${mmss(S.restDefault)} ändern</button></div>`;
}
function emptyRoutines(){return `<div class="empty"><strong>Noch keine Routinen</strong>Leg deine Trainingstage an, z. B. Legday Kraft und Legday Athletik.<div class="row" style="justify-content:center;margin-top:12px"><button class="btn gold sm" data-act="r-new">Routine erstellen</button><button class="btn ghost sm" data-act="tl-open">Vorlage wählen</button></div></div>`}

function curIdx(){const x=S.active?S.active.exercises:[];if(S.active&&S.active.hold!=null){if(S.rest&&x[S.active.hold])return S.active.hold;delete S.active.hold}const f=x.findIndex(e=>e.sets.length&&e.sets.some(s=>!s.done));if(f<0||!x[f].ss)return f;
 let best=f,bd=1e9;x.forEach((e,i)=>{if(e.ss!==x[f].ss||!e.sets.some(s=>!s.done))return;const d=e.sets.filter(s=>s.done).length;if(d<bd){bd=d;best=i}});return best}
function ssLabel(e){if(!e.ss||!S.active)return '';const g=S.active.exercises.filter(x=>x.ss===e.ss);const ids=[...new Set(S.active.exercises.filter(x=>x.ss).map(x=>x.ss))];return (g.length>2?'Zirkel ':'Supersatz ')+String.fromCharCode(65+ids.indexOf(e.ss))+' · '+(g.indexOf(e)+1)+'/'+g.length}
function ssLastIdx(e){if(!e.ss||!S.active)return -1;let k=-1;S.active.exercises.forEach((x,i)=>{if(x.ss===e.ss)k=i});return k}
function vActive(){
  const a=S.active;
  return `<div class="wk-head"><div class="spread"><span class="eyebrow">${a.editOf?'Training bearbeiten · '+fDate(a.start):'Training läuft'}</span>${a.editOf?'':'<span class="timer num" id="elapsed">0:00</span>'}</div>
  <input class="wk-name" id="wname" data-in="wname" value="${esc(a.name)}" aria-label="Name des Trainings"></div>
  <div class="card"><div class="ntl" style="margin-top:0">Notiz zum Training</div><textarea class="nt" data-in="wnote" rows="${ntRows(a.note)}" placeholder="Wie lief's, Schlaf, Energie …">${esc(a.note||'')}</textarea></div>
  <div class="exsep"><span>Übungen</span></div>
  <div class="stack">${a.exercises.map((e,i)=>exCard(e,i,i===curIdx())).join('')}</div>
  <div class="stack" style="margin-top:14px">
    <button class="btn ghost full" data-act="add-ex">+ Übung hinzufügen</button>
    ${a.exercises.length>1?'<button class="btn ghost full" data-act="order">Übungsreihenfolge bearbeiten</button>':''}
    <button class="btn gold full" data-act="finish">${a.editOf?'Änderungen speichern':'Training beenden'}</button>
    <button class="btn danger full" data-act="cancel">${a.editOf?'Bearbeitung abbrechen':'Training verwerfen'}</button>
  </div>`;
}
function poRange(t){const m=String(t||'').match(/(\d+)\s*[-–]\s*(\d+)/);if(m)return [+m[1],+m[2]];const n=String(t||'').match(/(\d+)/);return n?[+n[1],+n[1]]:null}
function warmList(){try{return JSON.parse(localStorage.getItem('hantelbuch.warmex')||'[]')}catch(e){return []}}
function isWarmEx(n){return /warm|aufw[äa]rm/i.test(n)||warmList().includes(n)}
function incKg(kg,name){const st=name?num(String(gearOf(name).step||'').replace(',','.')):0;if(st>0)return Math.round((kg+st)*100)/100;return kg<10?kg+1:Math.round((kg+2.5)/2.5)*2.5}
function setGoals(e){if(isCardio(e)||!poOn()||isWarmEx(e.name)||(S.active&&S.active.editOf))return null;const rg=poRange(e.target);const prevW=(prevFor(e.name)||[]).filter(s=>s.type!=='w'&&num(s.reps));if(!prevW.length)return [];let k=0;
 return e.sets.map(st=>{if(st.type==='w')return null;const p=prevW[k++];if(!p)return null;const kg=num(p.kg),rp=num(p.reps),lv=effLvl(p.rpe);
  if(rg&&rp>rg[1])return {kg:kg?incKg(kg,e.name):0,reps:rg[0],up:true,from:rp};
  if(lv===2)return {kg,reps:rp,clean:true};
  return {kg,reps:rp+1}})}
function applyGoals(){if(!S.active||!poOn())return;for(const e of S.active.exercises){const g=setGoals(e);if(!g)continue;g.forEach((G,j)=>{const st=e.sets[j];if(!G||!st||st.done)return;if(G.kg)st.kg=String(G.kg);st.reps=String(G.reps)})}saveActive();renderMain()}
function poHint(e){const g=setGoals(e);if(!g)return '';const rg=poRange(e.target);
 if(!g.length)return poMode()==='short'?`<div class="pohint"><b>Erstes Mal:</b> Gewicht im Zielbereich finden</div>`:`<div class="pohint"><b>Erstes Mal:</b> Such dir ein Gewicht, mit dem du ${rg?`${rg[0]}–${rg[1]}`:'ein paar'} saubere Wiederholungen schaffst. Ab dann gilt: in jedem Satz 1 mehr.</div>`;
 let n=0;const nums=g.map(x=>x?++n:null);const up=g.map((x,j)=>x&&x.up?nums[j]:null).filter(Boolean);const cl=g.map((x,j)=>x&&x.clean?nums[j]:null).filter(Boolean);const L=a=>a.length>1?a.slice(0,-1).join(', ')+' und '+a[a.length-1]:String(a[0]);
 if(poMode()==='short'){const rest=n-up.length-cl.length;const parts=[];if(up.length)parts.push(`<b>Gewicht hoch in Satz ${L(up)}</b>`);if(cl.length)parts.push(cl.length===n?'<b>Ziel heute: gleiche Wdh., aber sauber</b>':`<b>Satz ${L(cl)}: gleiche Wdh., sauberer</b>`);if(rest>0)parts.push(up.length||cl.length?'sonst +1 Wdh.':'<b>Ziel heute: +1 Wdh. pro Satz</b>');return `<div class="pohint${up.length?' up':''}">${parts.join(' · ')}</div>`}
 const inc=g.map((x,j)=>x&&!x.up&&!x.clean?nums[j]:null).filter(Boolean);const nxt=rg?` Kommt ein Satz über ${rg[1]} Wdh., steigt dort beim nächsten Mal das Gewicht.`:'';
 if(up.length)return `<div class="pohint up"><b>Gewicht hoch in Satz ${L(up)}.</b> Dort warst du letztes Mal über ${rg[1]} Wdh. ${inc.length?`Satz ${L(inc)}: gleiches Gewicht, 1 Wdh. mehr. `:''}${cl.length?`Satz ${L(cl)}: gleiche Wdh., aber sauber. `:''}Jeder Satz wird für sich gesteigert. Dein Ziel für jeden Satz ist schon eingetragen.</div>`;
 if(cl.length&&!inc.length)return `<div class="pohint"><b>Ziel heute:</b> gleiche Wdh. wie letztes Mal, aber sauber. Erst wenn jede Wiederholung sauber ist, geht es wieder nach oben. Dein Ziel für jeden Satz ist schon eingetragen.</div>`;
 if(cl.length)return `<div class="pohint"><b>Ziel heute:</b> Satz ${L(inc)}: 1 Wdh. mehr als letztes Mal. Satz ${L(cl)}: gleiche Wdh., aber sauber. Dein Ziel für jeden Satz ist schon eingetragen.${nxt}</div>`;
 return `<div class="pohint"><b>Ziel heute:</b> in jedem Satz 1 Wdh. mehr als letztes Mal. Dein Ziel für jeden Satz ist schon eingetragen.${nxt}</div>`}
const INTRO=[
 {k:'Warum tracken?',h:'Was du misst, wird besser.',t:'Dein Körper wird nur stärker, wenn du ihm jedes Mal ein bisschen mehr abverlangst. Ohne Notizen weisst du aber nicht, was „mehr“ ist. REPIT merkt sich jeden Satz und zeigt dir beim nächsten Mal genau, was du schlagen musst.'},
 {k:'Progressive Overload',h:'Jedes Mal 1 Wiederholung mehr.',t:'Jede Übung hat einen Zielbereich, z. B. 6–8 Wdh. Du versuchst jedes Training eine Wiederholung mehr zu schaffen. Kommst du über den Zielbereich, nimmst du mehr Gewicht und fängst wieder unten an.',lad:true},
 {k:'Rep it. Track it. Repeat.',h:'Immer das nächste Training.',t:'Deine Routinen laufen im Kreis: 1, 2, 3, 4 … und dann wieder von vorne. Keine festen Tage. Fällt ein Tag aus, machst du am nächsten freien Tag einfach das nächste Training. REPIT zeigt es dir mit „Als Nächstes“ an, und im Training steht bei jeder Übung dein Ziel für heute.'}];
function sIntro(){const i=S.introStep||0,x=INTRO[i];return `<div class="eyebrow">${esc(x.k)}</div><h2 style="margin-top:4px">${esc(x.h)}</h2><p class="mini" style="line-height:1.55;margin-top:8px">${esc(x.t)}</p>
 ${x.lad?`<div class="ladder">${[['Training 1','60 kg × 6','',''],['Training 2','60 kg × 7','','+1'],['Training 3','60 kg × 8','','+1'],['Training 4','60 kg × 9','g','über dem Ziel!'],['Training 5','62,5 kg × 6','o','neues Gewicht']].map(([a,b,c,d],j)=>`<div class="lad"><span class="muted">${a}</span><i class="${c}" style="width:${55+j*11}%">${b}${d?`<span style="margin-left:8px;font-weight:600;opacity:.8">${d}</span>`:''}</i></div>`).join('')}</div><p class="muted mini" style="line-height:1.5">Jeder Satz so nah wie möglich ans Muskelversagen, aber saubere Ausführung ist wichtiger als mehr Gewicht. Das gilt für jeden Satz einzeln: Schafft Satz 1 mehr als das Ziel, steigt nur dort das Gewicht. Bewerte jeden Satz ehrlich mit 1–4: 1 zu leicht, 2 letzte Wiederholung unsauber, 3 letzte Wiederholung nur halb geschafft, 4 alles gegeben, mehr ging nicht.</p>`:''}
 <div class="dots">${INTRO.map((_,j)=>`<span class="${j===i?'on':''}"></span>`).join('')}</div>
 <div class="row" style="gap:8px;flex-wrap:nowrap">${i>0?'<button class="btn ghost" style="flex:1" data-act="intro-prev">Zurück</button>':''}<button class="btn gold" style="flex:2" data-act="intro-next">${i<INTRO.length-1?'Weiter':'Los geht’s'}</button></div>${i===INTRO.length-1?'<button class="btn ghost full" style="margin-top:8px" data-act="guide">Ganze Funktionsanleitung öffnen</button>':''}`}
function introSeen(){try{return !!localStorage.getItem('hantelbuch.intro')}catch(e){return true}}
function exCard(e,i,cur){
  const prev=prevFor(e.name)||[];const ssMid=!!e.ss&&ssLastIdx(e)!==i;const warm=isWarmEx(e.name);
  const cardio=isCardio(e);const goals=setGoals(e)||[];
  const rows=e.sets.map((s,j)=>{const p=prev[j]||s.goal;const G=goals[j];const pk=G?String(G.kg||''):p?String(num(p.kg)):'';const pr=G?String(G.reps):p?String(num(p.reps)):'';let wn=0;
    return `<tr class="setrow ${s.done?'done':''}" data-i="${i}" data-j="${j}">
    <td><button class="setno ${s.type==='w'?'w':''}" data-act="set-type" data-i="${i}" data-j="${j}" aria-label="Satztyp wechseln">${s.type==='w'?'W':e.sets.slice(0,j+1).filter(x=>x.type!=='w').length}</button></td>
    <td class="prev">${p?(cardio?`${num(p.reps)} min`:`${fmt(num(p.kg))} × ${num(p.reps)}${p.rpe?effBadge(p.rpe):''}`):'–'}${G&&!s.done?`<div class="pgoal${G.up?' up':''}">${G.up?'↑ '+(G.kg?fmt(G.kg)+' kg':'schwerer'):G.clean?'sauber':'+1 Wdh.'}</div>`:''}</td>
    ${cardio?'<td></td>':`<td><input class="cell" inputmode="decimal" id="kg-${i}-${j}" data-in="kg" data-i="${i}" data-j="${j}" value="${esc(s.kg)}" placeholder="${esc(pk)}" aria-label="Kilogramm"></td>`}
    <td><span class="rcell"><input class="cell" inputmode="numeric" id="rp-${i}-${j}" data-in="reps" data-i="${i}" data-j="${j}" value="${esc(s.reps)}" placeholder="${esc(pr)}" aria-label="${cardio?'Minuten':'Wiederholungen'}">${cardio?'':`<button class="rpeb ${s.rpe?'':'empty'}" data-act="rpe" data-i="${i}" data-j="${j}" aria-label="Anstrengung 1 bis 4 wählen">${s.rpe?effLvl(s.rpe):'1–4'}</button>`}</span></td>
    <td style="white-space:nowrap"><button class="sdel" data-act="set-del" data-i="${i}" data-j="${j}">Löschen</button><button class="check ${e.uni&&s.half&&!s.done?'half':''}" data-act="done" data-i="${i}" data-j="${j}" aria-label="Satz abhaken">${e.uni&&s.half&&!s.done?'L ✓':''}<svg viewBox="0 0 24 24" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg></button></td></tr>
    <tr class="restrow"><td colspan="5">${ssMid?`<div class="setrest" style="opacity:.55"><span></span>0:00 · direkt weiter<span></span></div>`:`<button class="setrest" data-act="srest" data-i="${i}" data-j="${j}" aria-label="Pause nach diesem Satz ändern"><span></span>${mmss(s.rest||e.rest||S.restDefault)}<span></span></button>`}</td></tr>`}).join('');
  const lt=lastEx(e.name);
  return `<div class="card ex${cur?' cur':''}${e.ss?' ss':''}${warm?' warm':''}">${e.ss||warm?`<div class="tagrow">${warm?`<span class="wtag">Aufwärmen</span>`:''}${e.ss?`<span class="sstag">${ssLabel(e)}</span>`:''}</div>`:''}<div class="ex-head"><div class="row" style="flex-wrap:nowrap;gap:10px;min-width:0;align-items:flex-start">${imgTag(e.name,'exthumb',`data-act="ex-open" data-v="${esc(e.name)}"`)}<div style="min-width:0"><h3 data-act="ex-open" data-v="${esc(e.name)}">${exTitle(e.name)}</h3><div class="muted mini">${lt?'Zuletzt '+ago(lt):'Erstes Mal'}${e.uni?` · <span style="color:var(--gold)">einseitig, Wechsel ${mmss(e.uniRest||15)}</span>`:''}</div></div></div>
  <div class="row" style="gap:6px;flex-wrap:nowrap"><button class="btn text sm" data-act="ex-menu" data-i="${i}" aria-label="Optionen">•••</button></div></div>
  <div class="exmeta">${cardio?'':targetBox(`data-in="ent" data-i="${i}"`,e.target)}${gearBtn(e.name)}</div>
  ${poHint(e)}
  ${noteBox(`data-in="ent" data-i="${i}"`,e.note,e.next,e.nextDate)}
  <table class="sets" style="margin-top:8px"><thead><tr><th>Satz</th><th>Vorher</th><th>${cardio?'':'kg'}</th><th>${cardio?'Min':'Wdh.'}</th><th></th></tr></thead><tbody>${rows}</tbody></table>
  ${cardio?`<div class="eyebrow" style="margin:10px 0 6px">Pulszone</div><div class="row" style="gap:6px;flex-wrap:wrap">${ZONES.map(z=>`<button class="chip ${e.zone===z[0]?'on':''}" style="white-space:nowrap;font-size:12px;padding:6px 10px" data-act="ex-zone" data-i="${i}" data-v="${z[0]}">Z${z[0]} <span class="muted">${z[1]}</span></button>`).join('')}</div>${zoneOf(e)?`<div class="muted mini" style="margin-top:4px">${zoneTxt(zoneOf(e))}</div>`:''}<details class="oldnotes" style="margin-top:4px"><summary>So misst du deinen Puls ▾</summary><div class="mini" style="line-height:1.55;padding:2px 0 6px">1. Zwei Finger (Zeige- und Mittelfinger) seitlich an den Hals auf die rechte Halsschlagader legen, nur leicht drücken und nur auf einer Seite.<br>2. Auf eine Uhr mit Sekundenzeiger schauen.<br>3. 6 Sekunden lang zählen, wie oft es pocht.<br>4. Die Zahl mal 10 = dein Puls. Beispiel: 13 Schläge × 10 = 130 → Zone 2.</div></details>`:''}
  <button class="btn text sm" style="margin-top:4px" data-act="add-set" data-i="${i}">+ Satz</button></div>`;
}

function isoWeek(d){d=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const n=d.getUTCDay()||7;d.setUTCDate(d.getUTCDate()+4-n);const y=new Date(Date.UTC(d.getUTCFullYear(),0,1));return Math.ceil(((d-y)/864e5+1)/7)}
function wkOff(){try{return +(localStorage.getItem('hantelbuch.wkoff')||0)}catch(e){return 0}}
function curWeek(){return (isoWeek(new Date())+wkOff())%2===0?'A':'B'}
function hasWeeks(){return S.routines.some(r=>r.folder!=='coach'&&r.week)}
function wkView(){return S.wkView||curWeek()}
function weekFilter(list){if(!hasWeeks())return list;const w=wkView();return list.filter(r=>!r.week||r.week===w)}
function weekBar(){if(!hasWeeks())return '';const c=curWeek(),v=wkView();return `<div class="spread" style="margin-bottom:10px;gap:8px"><span class="row" style="gap:6px">${['A','B'].map(w=>`<button class="chip ${v===w?'on':''}" data-act="wk-view" data-v="${w}">Woche ${w}${c===w?' · jetzt':''}</button>`).join('')}</span><button class="btn text sm" data-act="wk-swap">Wochen tauschen</button></div>`}
function myRoutines(){const c=S.rfolder==='coach',k=S.rclient||'';return S.routines.filter(r=>c?r.folder==='coach'&&(!k||(r.client||'')===k):r.folder!=='coach')}
function clients(){let x=[];try{x=JSON.parse(localStorage.getItem('hantelbuch.clients')||'[]')}catch(e){}for(const r of S.routines)if(r.folder==='coach'&&r.client&&!x.includes(r.client))x.push(r.client);return x.sort((a,b)=>a.localeCompare(b,'de'))}
function saveClients(x){try{localStorage.setItem('hantelbuch.clients',JSON.stringify(x))}catch(e){}}
function sClient(){return `<div class="eyebrow">Coach</div><h2 style="margin-top:2px">Neuer Kunde</h2><input class="field" id="clName" placeholder="Name, z. B. Max" style="margin-top:10px"><div class="muted mini" style="margin-top:6px">Für jeden Kunden gibt es eine eigene Rubrik mit seinen Trainings. Beim Teilen ist der Name schon eingetragen.</div><button class="btn gold full" style="margin-top:12px" data-act="cl-save">Anlegen</button>`}

function vExercises(){

function exMode(){if(!S.exMode){try{S.exMode=localStorage.getItem('hantelbuch.exmode')}catch(e){}}return S.exMode||'cat'}
function exCats(){const o=[...CATS,'Cardio'];const all=[...new Set(allNames().map(catOf))];return [...o.filter(c=>all.includes(c)),...all.filter(c=>!o.includes(c)).sort()]}
function exList(){
  const qq=S.exq.toLowerCase();
  const names=allNames().filter(n=>n.toLowerCase().includes(qq));
  const m=exMode(),fc=S.exCat||'';
  const withData=names.filter(n=>!fc||catOf(n)===fc).map(n=>({n,s:sessions(n)})).sort(m==='oft'?(a,b)=>(b.s.length-a.s.length)||a.n.localeCompare(b.n,'de'):(a,b)=>a.n.localeCompare(b.n,'de'));
  const li=({n,s})=>{const b=s.length?bests(n):null;return `<button class="li" data-act="ex-open" data-v="${esc(n)}"><span class="row" style="flex-wrap:nowrap;gap:0;min-width:0">${imgTag(n,'lithumb')}<span style="min-width:0;text-align:left"><span class="name">${esc(n)}</span><br><span class="muted mini">${catOf(n)}${s.length?' · zuletzt '+ago(s[0].w.start):''}</span></span></span><span class="num" style="color:var(--gold)">${b&&b.e1?fmt(b.e1)+' kg':''}</span></button>`};
  if(!withData.length)return '<div class="empty">Keine Übung gefunden.</div>';
  if(m!=='cat'||fc)return withData.map(li).join('');
  return exCats().map(c=>{const g=withData.filter(x=>catOf(x.n)===c);return g.length?`<div class="exsep" style="margin:16px 2px 8px"><span>${esc(c)} · ${g.length}</span></div>${g.map(li).join('')}`:''}).join('');
}

/* chart: points [{x:label,y}] */
function chart(pts,unit,goal){
  const W=320,H=150,L=38,R=10,T=12,B=22;
  const ys=pts.map(p=>p.y).concat(goal!=null?[goal]:[]);let mn=Math.min(...ys),mx=Math.max(...ys);if(mx-mn<1){mn-=1;mx+=1}const pad=(mx-mn)*.12;mn-=pad;mx+=pad;
  const X=i=>L+(pts.length===1?0:(i*(W-L-R)/(pts.length-1))),Y=v=>T+(mx-v)*(H-T-B)/(mx-mn);
  const ticks=[mn+(mx-mn)*.15,(mn+mx)/2,mx-(mx-mn)*.15];
  const line=pts.map((p,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(p.y).toFixed(1)).join(' ');
  const area=line+` L${X(pts.length-1).toFixed(1)} ${H-B} L${L} ${H-B} Z`;
  const lab=k=>{const d=new Date((k.length===10?k+'T12:00':k));return isNaN(d)?'':d.toLocaleDateString('de-CH',{day:'numeric',month:'numeric'})};
  const lastI=pts.length-1;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Verlauf in ${unit}">
  ${ticks.map(t=>`<line class="grid" x1="${L}" x2="${W-R}" y1="${Y(t).toFixed(1)}" y2="${Y(t).toFixed(1)}"/><text class="lbl" x="${L-6}" y="${(Y(t)+3).toFixed(1)}" text-anchor="end">${fmt(t)}</text>`).join('')}
  ${goal!=null?`<line x1="${L}" x2="${W-R}" y1="${Y(goal).toFixed(1)}" y2="${Y(goal).toFixed(1)}" stroke="var(--gold-hi)" stroke-width="1.5" stroke-dasharray="5 4"/><text class="lbl" x="${W-R}" y="${(Y(goal)-5).toFixed(1)}" text-anchor="end" style="fill:var(--gold-hi);font-weight:700">Ziel ${fmt(goal)}</text>`:''}
  <path class="ar" d="${area}"/><path class="ln" d="${line}"/>
  <circle class="dot" cx="${X(lastI).toFixed(1)}" cy="${Y(pts[lastI].y).toFixed(1)}" r="4"/>
  <text class="lbl" x="${L}" y="${H-6}">${lab(pts[0].x)}</text><text class="lbl" x="${W-R}" y="${H-6}" text-anchor="end">${lab(pts[lastI].x)}</text></svg>`;
}

function openSheet(s){S.sheet=s;renderSheet()}
function closeSheet(){const b=S.sheet&&S.sheet.back||null;const wasGear=S.sheet&&S.sheet.type==='gear';S.sheet=b;S.edit=null;renderSheet();if(wasGear)renderMain()}
function renderSheet(){
  const sh=$('#sheet'),bd=$('#backdrop');

  sh.hidden=false;bd.hidden=false;
  const f=({picker:sPicker,menu:sMenu,routine:sRoutine,hist:sHist,ex:sEx,confirm:sConfirm,summary:sSummary,guide:sGuide,checkin:sCheckin,rest:sRestDefault,data:sData,setrest:sSetRest,rpe:sRpe,order:sOrder,rorder:sROrder,tpl:sTpl,client:sClient,week:sWeek,day:sDay,intro:sIntro,share:sShare,planin:sPlanIn,pay:sPay,rday:sRDay,gender:sGender,gear:sGear,rview:sRView,rx:sRx,tlist:sTList,tview:sTView})[S.sheet.type];

const GUIDE=[
['Routinen & Reihenfolge','Leg pro Trainingstag eine Routine an (Routinen → +). Die Routinen laufen im Kreis 1 → 2 → 3 und dann von vorne. Das nächste Training ist golden mit „Als Nächstes“ markiert. Fällt ein Tag aus, machst du einfach das nächste. Feste Wochentage kannst du oben mit „1 · 2 · 3 | Wochentage“ einschalten. Für Wochenwechsel (z. B. Woche A Kraft, Woche B Athletik) stellst du in der Routine „Gilt für“ auf Woche A oder B.'],
['Training starten & Sätze','Bei der Routine auf Start. Kg und Wdh. eintragen, dann den Haken antippen, so startet die Pause. Ziele aus dem letzten Mal sind schon eingetragen. Unter „Vorher“ siehst du, was du letztes Mal geschafft hast. Satznummer antippen = Aufwärmsatz (W), der zählt nicht für die Steigerung.'],
['Progressive Overload','Jede Übung hat einen Zielbereich, z. B. 6–8. Jeder Satz wird einzeln gesteigert: Warst du letztes Mal über dem oberen Ziel, steigt nur in diesem Satz das Gewicht. Sonst ist das Ziel 1 Wdh. mehr. Saubere Ausführung geht immer vor Gewicht.'],
['Anstrengung 1–4','Nach jedem Satz kurz bewerten (1–4 beim Wdh.-Feld). 1 Zu leicht: nächstes Mal steigern. 2 Letzte unsauber: Gewicht erstmal behalten, sauberer ausführen. 3 Nur halb geschafft: die letzte Wiederholung ging nur noch halb. 4 Alles gegeben | Muskelversagen. Bei Wdh. trägst du immer nur die ganz geschafften ein, die Stufe sagt, was danach noch kam.'],
['Hinweise','In Daten → „Hinweise im Training“: Anfängerhilfe (ausführlich, mit Erinnerungen), Trainingshinweis (eine Zeile) oder Aus.'],
['Varianten (eigener Verlauf)','Gleiche Übung, aber getrennt speichern, z. B. Kabelcurls am Rückentag und am Armtag: Übung → ••• → „Variante“ eintragen, z. B. „Rückentag“. Dann hat „Kabelcurls · Rückentag“ eigene Werte, Ziele und Notizen. Ohne Variante teilt sich eine Übung den Verlauf über alle Tage. Die Variante immer gleich schreiben.'],
['Supersatz & Zirkel','Übung → ••• → „Mit nächster Übung koppeln“. Für 3 oder mehr Übungen bei der nächsten „Zur Gruppe davor hinzufügen“. Die App springt nach jedem Satz zur nächsten Übung der Gruppe, ohne Pause. Erst nach der letzten Übung läuft die Pause, die Ansicht bleibt dabei stehen.'],
['Einseitig (links/rechts)','Übung → ••• → „Einseitig an“. Ein Haken = erste Seite, kurze Wechselpause, zweiter Haken = Satz fertig. Die Wechselpause stellst du dort ein.'],
['Aufwärmen','Aufwärmübungen sind blau markiert und zählen nicht für die Steigerung. Aufwärmsätze markierst du, indem du die Satznummer antippst (W).'],
['Pause & Timer-Ton','Pause pro Satz: die Zeit unter dem Satz antippen. Standard-Pause und Ton: Routinen → „Pause & Timer-Ton“. Ton kann vor der Glocke kommen oder sie ersetzen. ⏱ in der Pausenleiste startet den iPhone-Timer.'],
['Geräte-Einstellung & Gewichtsschritte','Bei der Übung auf „Einstellung“: Sitzhöhe, Polster, Kabelstufe usw. notieren und die Gewichtsschritte der Maschine (z. B. 2,5 oder 5 kg). Die App erhöht dann in diesen Schritten.'],
['Notizen','„Notiz (bleibt)“ steht bei jedem Training wieder da. „Fürs nächste Mal“ ist eine Erinnerung für das nächste Training. Ältere Notizen findest du in der Übung (Name antippen).'],
['Cardio & Pulszone','Cardio-Übung (z. B. Stairmaster): Minuten eintragen, Pulszone wählen (Puls messen: zwei Finger leicht an die rechte Halsschlagader, 6 Sekunden zählen, mal 10; Z1 100–120 Locker, Z2 120–140 Fettverbrennung (reden geht noch), Z3 140–160 Ausdauer (kurze Sätze), Z4 160–175 Tempo-Grenze (einzelne Wörter, brennt), Z5 175+ Vollgas (Sprint)) und abhaken. Dann läuft ein Cardio-Timer wie die Pause. Speicherst du das Training vorher, wird die restliche Cardiozeit schon zur Trainingsdauer dazugerechnet. Hast du doch mehr oder weniger gemacht: Verlauf → Training antippen → Minuten ändern, Dauer und kcal passen sich an.'],
['Kalorien','Die kcal werden geschätzt aus deinem Körpergewicht (Körper-Tab), der Trainingszeit, dem bewegten Gewicht und beim Cardio aus Gerät, Minuten und Pulszone.'],
['Check-in Essen & Gefühl','Nach dem Speichern fragt die App immer zuerst: „Wie hat sich das Training angefühlt?“ (1–4), danach siehst du alle Werte. Die Frage vor dem Start zum Essen (Carbs voll?) schaltest du in Daten ein. Im Wochenbericht siehst du, bei welchem Essen deine Trainings am besten laufen.'],
['Training beenden','Beim Beenden zeigt die App alle Sätze, die noch nicht abgehakt sind (auch Cardio). Antippen = doch gemacht, wird mitgespeichert. Was nicht abgehakt ist, wird nicht gespeichert.'],
['Verlauf & Bearbeiten','Verlauf → Training antippen: Start- und Endzeit, Notizen und Werte ändern, kcal werden neu gerechnet. „Bearbeiten“ öffnet das Training nochmal komplett.'],
['Routine ansehen','Tipp auf eine Routine zeigt alle Übungen mit Bild, Ziel und Startgewichten, ohne das Training zu starten. Über „Bearbeiten“ und einen Tipp auf die Übung änderst du Variante, Ziel, Gewichte, Pause und Notiz.'],
['Vorlagen','Routinen → „Vorlagen“: SOL-Vorlagen (gold, z. B. Dons Training) und deine eigenen (grau). Eine Vorlage ist wie ein Ordner mit Trainingstagen. „Übernehmen für“ legt eine Kopie bei dir oder bei einem Kunden an, die du dort frei anpasst.'],
['Wochenbericht','Verlauf → „Wochenbericht“: pro Übung besser, gleich oder schlechter (antippen = nur diese anzeigen), Volumen, kcal, Ø Anstrengung, Körpergewicht. Mit Export zum Teilen, z. B. für den Coach.'],
['Körper & Fotos','Körper: Gewicht eintragen, Start- und Zielgewicht setzen. Tag antippen für Tagesnotiz und Formcheck-Fotos (gross ansehen und löschen möglich).'],

function durSplit(w){const cm=wCardioMin(w);if(!cm)return '';const tot=(w.end||w.start)-w.start;return `Training ${dur(Math.max(0,tot-cm*60000))} + Cardio ${dur(cm*60000)}`}
function wKcal(w){if(!w)return 0;const bw=bwAt(w.start);let cardioMin=0,ck=0,sets=0,vol=0;for(const e of (w.exercises||[])){const d=(e.sets||[]).filter(s=>s.done!==false);if(isCardio(e)){const z=zoneOf(e);for(const s of d){const m=num(s.reps);cardioMin+=m;ck+=cardioMet(e.name)*(z?z[3]:1)*bw*m/60}}else{sets+=d.filter(s=>s.type!=='w').length;for(const s of d)vol+=num(s.kg)*num(s.reps)}}
 let mins=w.end&&w.end>w.start?(w.end-w.start)/60000:0;if(mins<5||mins>400)mins=sets*2.5+cardioMin;const strMin=Math.max(0,mins-cardioMin);

 return Math.round(ck+3.5*bw*strMin/60+vol*0.0047)}

const EXDESC={"Stiff Leg Deadlift (Cable)":["steht mit dem Gesicht zum Kabelturm, Rolle ganz unten, Seil oder Stange in beiden Händen. Knie nur leicht gebeugt, die Hüfte weit nach hinten schieben und den Oberkörper mit geradem Rücken nach vorne senken, bis hinten in den Beinen eine Dehnung kommt, dann mit dem Gesäss wieder aufrichten","Beinbeuger, Gesäss","Rückenstrecker","Rücken bleibt immer gerade, Blick leicht nach vorne unten. Nur so tief, wie der Rücken gerade bleibt. Oben das Gesäss anspannen, nicht ins Hohlkreuz gehen."],"Cable Side Kick":["steht seitlich zum Kabelturm, Rolle ganz unten, Fussmanschette am äusseren Fuss. Mit einer Hand am Turm festhalten, Oberkörper aufrecht, und das gestreckte Bein seitlich vom Körper weg nach aussen heben, langsam zurück","seitlicher Gesässmuskel (Gluteus medius)","Gluteus minimus, Hüfte","Leichtes Gewicht. Oberkörper bleibt aufrecht, nicht zur Seite kippen. Fussspitze zeigt nach vorne, nicht nach oben drehen. Oben kurz halten."],"Cable Glute Kickback":["steht mit dem Gesicht zum Kabelturm, Rolle ganz unten, Fussmanschette am Arbeitsbein. Mit beiden Händen am Turm abstützen, Oberkörper leicht nach vorne geneigt, und das Bein gestreckt bzw. leicht gebeugt nach hinten-oben drücken","grosser Gesässmuskel (Gluteus maximus)","Beinbeuger","Bauch fest, kein Hohlkreuz: die Bewegung kommt aus der Hüfte, nicht aus dem unteren Rücken. Oben das Gesäss kurz fest anspannen, dann langsam zurück."],"Chest Press Cable 2. (to the ground)":["steht mittig zwischen zwei Kabeltürmen, die Rollen ganz oben eingestellt (man muss fast springen, um die Griffe zu holen). Die Ellbogen zeigen hoch Richtung Rollen. Dann drückt man die Griffe schräg nach unten Richtung Füsse und führt die Hände vor der Hüfte zusammen","untere Brust","Trizeps, vordere Schulter","Leichte Schrittstellung für Halt, Oberkörper leicht nach vorne. Unten die Hände kurz zusammendrücken und die untere Brust anspannen, dann langsam zurück nach oben."],"Chest Press (Cable)":["sitzt mittig zwischen zwei Kabeltürmen auf einer Bank (ca. 1 m vor den Türmen, Lehne ca. 75°), die Rollen sind auf ca. 45 cm Höhe eingestellt (etwa Sitzhöhe), je ein Griff in jeder Hand, Handflächen nach unten (Daumen zeigen nach innen). Mit leichtem Hohlkreuz drückt man die Griffe von der Brust gerade nach vorne und führt die Hände am Ende vorne zusammen","untere und mittlere Brust","vordere Schulter, Trizeps","Erst mit leichtem Gewicht die Position finden: Bank so weit vorne, dass die Kabel schon am Anfang Spannung haben. Gerade nach vorne drücken, nicht nach oben. Vorne kurz die Brust zusammendrücken, dann langsam zurück."],"Stairmaster":["steigt auf dem Stairmaster gleichmässig Stufe für Stufe, Oberkörper aufrecht, Hände nur leicht am Geländer","Gesäss, Quadrizeps","Waden, Herz-Kreislauf"],"Laufband (Steigung gehen)":["geht zügig auf dem Laufband mit hoher Steigung, ohne sich festzuhalten","Gesäss, Waden","Herz-Kreislauf"],"Kabelcurls einarmig":["steht seitlich zum Kabelturm, Rolle ganz unten, greift den Einhand-Griff und curlt ihn mit einem Arm zur Schulter, Ellbogen bleibt am Körper","Bizeps","Unterarme","Leichtes Gewicht, Ellbogen fest an der Seite. Oben kurz anspannen, langsam ablassen bis der Arm fast gestreckt ist. Erst links, dann rechts."],"Deficit Deadlift (Trap Bar)":["steht erhöht auf einer Platte in der sechseckigen Trap Bar, greift die seitlichen Griffe und hebt die Stange aus der tieferen Startposition bis zum aufrechten Stand, Rücken neutral, Druck über die ganzen Füsse","Gesäss, Quadrizeps, Rückenstrecker","Beinbeuger, oberer Rücken, Unterarme","Starte mit leichtem Gewicht und kleiner Erhöhung. Brust hoch, Hüfte und Schultern steigen gleichzeitig. Erst die Tiefe sauber beherrschen, dann Gewicht steigern."],"Dragon Flag":["liegt auf einer Flachbank, hält sich hinter dem Kopf an der Bank fest und hebt den ganzen Körper gestreckt bis auf die Schultern an, dann senkt sie ihn langsam und gerade wieder ab, ohne in der Hüfte abzuknicken","gerader Bauchmuskel, tiefe Bauchmuskulatur","Latissimus, Hüftbeuger, Gesäss","Schritt 1: Nur langsam absenken (Negativ), mit angewinkelten Knien. Schritt 2: Ein Bein gestreckt. Schritt 3: Beide Beine gestreckt. Der Körper bleibt immer eine gerade Linie, das Gewicht liegt auf den Schultern, nicht auf dem Nacken."],"Sprawl": ["lässt sich aus der Kampfstellung fallen, schiesst die Beine gestreckt nach hinten, drückt die Hüfte auf den Boden, stützt mit den Händen vorne ab und springt sofort zurück in die Kampfstellung", "Hüftbeuger, Bauch, Brust", "Schultern, Beine, Ausdauer", "Erst langsam in drei Teilen: Hände runter, Beine zurück, Hüfte runter. Kopf bleibt oben, Blick nach vorne. Dann Tempo steigern. Ziel: 10 saubere Sprawls in unter 20 Sekunden."], "Double-Leg-Shot (Ringen)": ["senkt aus der Kampfstellung die Hüfte, macht einen tiefen Schritt nach vorne (Penetration Step), das hintere Knie tippt kurz den Boden, die Arme greifen um beide Oberschenkel, der Kopf ist seitlich am Körper, dann drückt das hintere Bein nach vorne durch", "Beine, Gesäss", "Rücken, Nacken, Bauch", "Zuerst nur den Schritt an einer Linie entlang üben, ohne Partner. Rücken gerade, Kopf hoch, nie auf den Boden schauen. Wenn das sitzt, mit Partner oder Dummy den Griff und das Durchdrücken dazunehmen."], "Ringerbrücke": ["liegt auf dem Rücken, Füsse nah am Gesäss, drückt die Hüfte hoch und rollt kontrolliert auf den Kopf, sodass Nacken und Rücken einen Bogen bilden", "Nacken, Rückenstrecker", "Gesäss, Beinbeuger", "Nur auf weicher Matte. Am Anfang die Hände neben dem Kopf mit abstützen und langsam vor und zurück rollen, nie ruckartig. Mit Nackenproblemen weglassen."], "Kip-up": ["liegt auf dem Rücken, rollt die Beine über den Kopf zurück, Hände neben den Ohren, schnellt dann Beine und Hüfte explosiv nach vorne-oben, stösst sich mit den Händen ab und landet auf den Füssen", "Hüftbeuger, Bauch, Trizeps", "Schultern, Rücken", "Schritt 1: Zurückrollen und Hände neben die Ohren, ein paar Mal. Schritt 2: Beine kräftig nach vorne-oben kicken, Hüfte hoch, erst von einer erhöhten Matte aus. Schritt 3: Mit den Händen gleichzeitig abstossen und die Füsse unter den Körper ziehen. Auf weicher Matte üben."], "Technical Stand-up": ["steht aus der Bodenlage sicher auf: eine Hand hinten am Boden, der gegenüberliegende Fuss aufgestellt, Hüfte hoch, das andere Bein nach hinten durchziehen, die freie Hand bleibt oben als Deckung", "Bauch, Beine", "Schultern, Gesäss", "Beide Seiten langsam üben, Blick und Deckung immer nach vorne. Dann im Wechsel hinlegen und aufstehen, immer schneller."], "Hip Escape (Shrimp)": ["liegt auf dem Rücken, stellt einen Fuss auf, dreht sich auf die Seite und schiebt die Hüfte kräftig nach hinten weg, die Hände schieben dabei nach vorne", "schräge Bauchmuskeln, Gesäss", "Beine, Schultern", "Über die ganze Mattenlänge, die Seite jedes Mal wechseln. Die Hüfte wirklich wegschieben, nicht nur rollen."], "Sit-out (Ringen)": ["kniet in der Bankstellung, schiebt ein Bein unter dem Körper durch, dreht sich auf die Hüfte und kommt seitlich frei, Brust Richtung Boden", "Bauch, Hüftbeuger", "Schultern, Trizeps", "Erst langsam auf jeder Seite. Dann auf Kommando explosiv rausdrehen und sofort zurück in die Bank."], "Schattenboxen (Sek.)": ["boxt in der Kampfstellung gegen einen gedachten Gegner: Jab, Cross, Haken, dazu Kopfbewegung und Beinarbeit", "Schultern, Bauch", "Waden, Ausdauer", "Runden à 3 Minuten mit 1 Minute Pause. Nach jedem Schlag zurück in die Deckung, Kinn runter. Neue Kombinationen zuerst langsam und sauber."], "Boxsack (Sek.)": ["schlägt Kombinationen am Boxsack, bleibt dabei in Bewegung und hält die Deckung", "Schultern, Brust, Bauch", "Rücken, Beine, Ausdauer", "Runden à 2 bis 3 Minuten. Lieber locker und schnell als hart und langsam. Bandagen und Handschuhe tragen."], "Seilspringen (Sek.)": ["springt locker auf den Fussballen, Ellbogen nah am Körper, das Seil dreht aus den Handgelenken", "Waden", "Schultern, Ausdauer", "Erst einfache Sprünge, 30 Sekunden am Stück. Dann Wechselschritt wie beim Boxen, später Doppelsprünge."], "Burpees": ["geht in die Hocke, springt mit den Beinen nach hinten in den Liegestütz, macht einen Liegestütz, springt die Beine zurück und springt hoch", "Beine, Brust, Bauch", "Schultern, Ausdauer", "Sauber vor schnell. Für Kampfsport den Liegestütz durch einen Sprawl ersetzen, Hüfte runter statt Brust."],"Twisted Curls (Kurzhantel)":["curlt abwechselnd mit einem Arm (der andere bleibt unten), hebt die Kurzhantel bis der Ellbogen etwa im rechten Winkel ist, dreht dort das Handgelenk einmal nach innen und wieder zurück und senkt dann ab, danach der andere Arm","Bizeps, Unterarm","Brachialis"],"Bankdrücken (Langhantel)":["liegt auf der Flachbank, Füsse fest am Boden, Hände etwas breiter als schulterbreit, Unterarme senkrecht, Ellbogen ca. 45° vom Körper. Die Stange kontrolliert auf das Brustbein (Höhe Brustwarzen) senken und gerade nach oben drücken","grosser Brustmuskel","vordere Schulter, Trizeps"],"Schrägbankdrücken (Langhantel)":["liegt auf einer ca. 30° geneigten Schrägbank und drückt die Langhantel von der oberen Brust nach oben","oberer Brustmuskel","vordere Schulter, Trizeps"],"Bankdrücken (Kurzhantel)":["liegt auf der Flachbank und drückt zwei Kurzhanteln von Brusthöhe nach oben, Handflächen zeigen Richtung Füsse","grosser Brustmuskel","vordere Schulter, Trizeps"],"Schrägbankdrücken (Kurzhantel)":["liegt auf einer ca. 30° geneigten Schrägbank und drückt zwei Kurzhanteln nach oben","oberer Brustmuskel","vordere Schulter, Trizeps"],"Butterfly (Maschine)":["sitzt aufrecht an der Butterfly-Maschine und führt die leicht gebeugten Arme in einem Bogen vor der Brust zusammen","grosser Brustmuskel","vordere Schulter"],"Kabelzug-Fliegende":["steht mittig zwischen zwei Kabeltürmen, leicht vorgebeugt, und führt die Griffe in einem weiten Bogen vor der Brust zusammen","grosser Brustmuskel","vordere Schulter"],"Dips":["stützt sich am Barren, Oberkörper leicht nach vorne geneigt, senkt sich bis die Oberarme parallel zum Boden sind und drückt sich hoch","untere Brust, Trizeps","vordere Schulter"],"Liegestütze":["klassische Liegestütze, Körper in einer geraden Linie, Hände etwas breiter als schulterbreit, Brust fast am Boden","grosser Brustmuskel","Trizeps, vordere Schulter, Bauchmuskeln"],"Brustpresse (Maschine)":["sitzt an der Brustpresse und drückt die Griffe von Brusthöhe nach vorne","grosser Brustmuskel","vordere Schulter, Trizeps"],"Kreuzheben":["hebt eine beladene Langhantel vom Boden bis zum aufrechten Stand, Rücken neutral, Stange nah am Körper","Gesäss, Rückenstrecker, Beinbeuger","Quadrizeps, oberer Rücken, Unterarme"],"Klimmzüge":["hängt im Obergriff etwa schulterbreit an der Stange und zieht sich hoch, bis das Kinn über der Stange ist","breiter Rückenmuskel (Latissimus)","Bizeps, hintere Schulter, mittlerer Rücken"],"Latzug":["sitzt am Latzug, Oberschenkel fixiert, und zieht die breite Stange zur oberen Brust","breiter Rückenmuskel (Latissimus)","Bizeps, mittlerer Rücken"],"Langhantelrudern":["steht mit ca. 45° vorgebeugtem Oberkörper, Rücken neutral, und zieht die Langhantel zum Bauchnabel","Latissimus, mittlerer Rücken (Rhomboiden, mittlerer Trapez)","hintere Schulter, Bizeps, Rückenstrecker"],"Kurzhantelrudern":["stützt ein Knie und eine Hand auf der Flachbank und zieht mit dem anderen Arm eine Kurzhantel zur Hüfte","Latissimus, mittlerer Rücken","hintere Schulter, Bizeps"],"Kabelrudern sitzend":["sitzt aufrecht am Kabelzug, Füsse an der Plattform, und zieht den V-Griff zum Bauch, Schulterblätter zusammen","mittlerer Rücken, Latissimus","Bizeps, hintere Schulter"],"T-Bar-Rudern":["steht über der T-Bar, Oberkörper vorgebeugt, Rücken neutral, und zieht die Griffe zur Brust","mittlerer Rücken, Latissimus","hintere Schulter, Bizeps, Rückenstrecker"],"Face Pulls":["steht vor dem Kabelturm, Seil auf Augenhöhe, und zieht es zum Gesicht, Ellbogen hoch und nach aussen","hintere Schulter, oberer Rücken (Rhomboiden, Trapez)","Rotatorenmanschette"],"Hyperextensions":["liegt auf der 45°-Hyperextension-Bank, Hüfte am Polster, und richtet den Oberkörper bis zur geraden Linie auf","Rückenstrecker, Gesäss","Beinbeuger"],"Schulterdrücken (Langhantel)":["steht aufrecht, Bauch fest, und drückt die Langhantel von den Schultern gerade über den Kopf","vordere und seitliche Schulter","Trizeps, oberer Trapez"],"Schulterdrücken (Kurzhantel)":["sitzt aufrecht auf einer Bank mit Rückenlehne und drückt zwei Kurzhanteln von Schulterhöhe über den Kopf","vordere und seitliche Schulter","Trizeps"],"Seitheben":["steht aufrecht und hebt zwei Kurzhanteln mit leicht gebeugten Armen seitlich bis auf Schulterhöhe","seitliche Schulter","oberer Trapez"],"Seitheben am Kabel":["steht seitlich neben dem Kabelturm und hebt den Griff mit dem entfernten Arm seitlich bis auf Schulterhöhe","seitliche Schulter","oberer Trapez"],"Reverse Butterfly":["sitzt verkehrt herum auf einer kleinen Bank (Lehne senkrecht auf 90°, reicht bis unter die Brust), Brust an der Lehne, Blick zum Kabelturm, etwa eine Fusslänge hinter den Türmen. Die Rollen sind etwa auf Augenhöhe. Die Kabel werden überkreuzt gegriffen: rechte Hand nimmt das linke Kabel, linke Hand das rechte, sodass schon am Anfang volle Spannung auf der hinteren Schulter ist. Dann zieht man die Arme von oben weit nach aussen und schräg nach unten","hintere Schulter","oberer Rücken (Rhomboiden, mittlerer Trapez)","Leichtes Gewicht, Schultern unten lassen, nicht hochziehen. Die Bewegung kommt aus der hinteren Schulter, nicht aus dem Schwung. Aussen kurz halten, langsam zurück, bis sich die Arme vorne wieder kreuzen."],"Frontheben":["steht aufrecht und hebt eine Kurzhantel mit gestrecktem Arm vor dem Körper auf Schulterhöhe","vordere Schulter","oberer Brustmuskel"],"Shrugs":["steht aufrecht mit zwei schweren Kurzhanteln und zieht die Schultern gerade nach oben Richtung Ohren","oberer Trapezmuskel","Unterarme"],"Kniebeuge":["Langhantel auf dem oberen Rücken, beugt die Knie und schiebt die Hüfte nach hinten bis knapp unter parall uger","Unterarme"],"Cable Crunch":["kniet vor dem Kabelturm, Seil neben dem Kopf, und rollt den Oberkörper Richtung Knie ein","gerader Bauchmuskel","schräge Bauchmuskeln"],"Ab Wheel":["kniet und rollt das Bauchrad mit gestreckten Armen nach vorne aus, Rücken neutral","gerader Bauchmuskel, tiefe Bauchmuskulatur","Latissimus, Schultern"],"Russian Twists":["sitzt mit angehobenen Füssen, Oberkörper zurückgelehnt, und dreht eine Gewichtsscheibe von Seite zu Seite","schräge Bauchmuskeln","gerader Bauchmuskel"],"Pallof Press":["steht seitlich zum Kabelturm und drückt den Griff vor der Brust gerade nach vorne, ohne sich mitzudrehen","schräge Bauchmuskeln, tiefe Bauchmuskulatur","Schultern"],"Power Clean":["zieht die Langhantel explosiv vom Boden und fängt sie in der Frontablage auf den Schultern, zeige den Moment der vollen Hüftstreckung","Gesäss, Beinbeuger, Quadrizeps, Trapez","Waden, Schultern, Rückenstrecker"],"Kettlebell Swing":["schwingt die Kettlebell mit explosiver Hüftstreckung bis auf Brusthöhe, Arme locker gestreckt","Gesäss, Beinbeuger","Rückenstrecker, Bauchmuskeln, Schultern"],"Box Jumps":["springt beidbeinig explosiv auf eine hohe Box, zeige den Moment des Absprungs","Quadrizeps, Gesäss, Waden","Beinbeuger"],"Broad Jumps":["beidbeiniger Weitsprung aus dem Stand, zeige die volle Streckung in der Flugphase","Gesäss, Quadrizeps, Waden","Beinbeuger, Schultern"],"Sled Push":["schiebt einen beladenen Schlitten an den zwei Griffstangen (eine Hand pro Stange), Arme gestreckt, Körper stark nach vorne geneigt","Quadrizeps, Gesäss, Waden","Bauchmuskeln, Schultern"],"Medizinball-Wurf":["steht seitlich zur Wand und wirft einen Medizinball mit explosiver Hüft- und Rumpfrotation","schräge Bauchmuskeln, Gesäss","Schultern, Brust"],"Sprints (m)":["sprintet mit hohem Kniehub und kräftigem Armeinsatz, zeige die volle Laufphase","Beinbeuger, Gesäss, Quadrizeps, Waden","Hüftbeuger"],"Farmer's Walk":["geht aufrecht mit je einer schweren Kurzhantel in jeder Hand","Unterarme (Griffkraft), oberer Trapez, Bauchmuskeln","Waden, Gesäss"]};
function baseName(n){return String(n||'').split(' · ')[0].trim()}
function variantOf(n){const i=String(n||'').indexOf(' · ');return i<0?'':String(n).slice(i+3).trim()}
function exDesc(n){const b=baseName(n);return EXDESC[b]||EXDESC[IMG_ALIAS[b]]||null}
function exTitle(n){const v=variantOf(n);return esc(baseName(n))+(v?` <span class="vtag">${esc(v)}</span>`:'')}
function exImg(n,g){n=baseName(n);return 'img/'+slug(IMG_ALIAS[n]||n)+'-'+(g||gender())+'.jpg'}
function imgTag(n,cls,attrs){return `<img class="${cls}" src="${exImg(n)}" alt="" ${cls==='lithumb'?'loading="lazy" ':''}decoding="async" onerror="this.remove()" ${attrs||''}>`}

function defaultName(){const h=new Date().getHours();return h<11?'Morgentraining':h<17?'Mittagstraining':'Abendtraining'}

function finishWorkout(update){
  const a=clone(S.active);const wasEdit=!!a.editOf;a.end=wasEdit?(a.end||Date.now()):Date.now();if(wasEdit){const orig=S.workouts.find(x=>x.id===a.editOf);const cm=w=>(w.exercises||[]).filter(e=>isCardio(e)).reduce((t,e)=>t+e.sets.filter(st=>st.done).reduce((u,st)=>u+num(st.reps),0),0);if(orig)a.end=(orig.end||a.end)+(cm(a)-cm(orig))*60000}if(!wasEdit){for(const e of a.exercises)if(isCardio(e))for(const st of e.sets)if(st.done&&st.cstart){const pe=st.cstart+num(st.reps)*60000;if(pe>a.end)a.end=pe}if(S.rest&&/^Cardio/.test(S.rest.label||'')){S.rest=null;try{stopRestAudio()}catch(x){}}}delete a.editOf;if(wasEdit)update=false;
  a.exercises=a.exercises.map(e=>({...e,sets:e.sets.filter(s=>s.done)})).filter(e=>e.sets.length);
  const prs=[];
  for(const e of a.exercises){if(!sessions(e.name).length)continue;const b=bests(e.name,a.id);const bs=bestSet(e);if(!bs)continue;const kg=num(bs.kg),r=num(bs.reps);
    const top=Math.max(...doneSets(e).map(s=>num(s.kg)));
    if(e1rm(kg,r)>b.e1+.01)prs.push({name:e.name,kind:'1RM',val:fmt(e1rm(kg,r))+' kg'});
    else if(top>b.kg)prs.push({name:e.name,kind:'Gewicht',val:fmt(top)+' kg'});}
  a.prs=prs;
  const r=a.routineId&&S.routines.find(x=>x.id===a.routineId);
  if(r&&update){r.note=S.active.note||'';
    r.exercises=S.active.exercises.map(ae=>{const d=ae.sets.filter(st=>st.done);const src=d.length?d:ae.sets;
      return {name:ae.name,note:ae.note||'',next:ae.next||'',nextDate:ae.nextDate||null,uni:!!ae.uni,uniRest:ae.uniRest,ss:ae.ss,zone:ae.zone||null,target:ae.target||'',rest:(src[0]&&src[0].rest)||ae.rest||S.restDefault,sets:src.length,
        plan:src.map(st=>({kg:st.kg,reps:st.reps,rpe:st.rpe||'',rest:st.rest||ae.rest||S.restDefault}))}});
    saveMeta()}
  else if(r&&!wasEdit){for(const ae of S.active.exercises){const re=r.exercises.find(x=>x.name===ae.name);if(re){re.next=ae.next||'';re.nextDate=ae.nextDate||null}}saveMeta()}
  S.workouts=[a,...S.workouts.filter(w=>w.id!==a.id)].sort((x,y)=>y.start-x.start);S.lastSaved=a;
  saveWorkout(a);S.active=null;S.rest=null;stopRestAudio();saveActive(true);
  renderAll();openSheet({type:'summary',id:a.id});
}
