function wavFrom(buf){const sr=22050,len=Math.floor(buf.duration*sr),ch=buf.numberOfChannels;const off=new OfflineAudioContext(1,len,sr);const src=off.createBufferSource();src.buffer=buf;src.connect(off.destination);src.start();return off.startRendering().then(b=>{const d=b.getChannelData(0);const ab=new ArrayBuffer(44+d.length*2),v=new DataView(ab);const w=(o,t)=>{for(let i=0;i<t.length;i++)v.setUint8(o+i,t.charCodeAt(i))};w(0,'RIFF');v.setUint32(4,36+d.length*2,true);w(8,'WAVE');w(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,sr,true);v.setUint32(28,sr*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);w(36,'data');v.setUint32(40,d.length*2,true);let pk=0;for(const x of d)pk=Math.max(pk,Math.abs(x));const g=pk>0?.98/pk:1;for(let i=0;i<d.length;i++)v.setInt16(44+i*2,Math.max(-1,Math.min(1,d[i]*g))*32767,true);return new Blob([ab],{type:'audio/wav'})})}

function importStrong(rows){
  const h=rows[0].map(x=>x.trim().toLowerCase().replace(/^﻿/,''));
  const col=(...k)=>h.findIndex(x=>k.some(y=>x.includes(y)));
  const cD=col('date','datum'),cW=col('workout name','workout-name','trainingsname'),cE=col('exercise','übung'),cS=col('set order','reihenfolge','satz'),cKg=col('weight','gewicht'),cR=col('reps','wiederh','wdh'),cDist=col('distance','entfernung'),cDur=col('duration','dauer'),cSec=col('seconds','sekunden'),cRpe=h.findIndex(x=>x==='rpe'),cN=h.findIndex(x=>x==='notes'||x==='notizen'),cWN=h.findIndex(x=>x==='workout notes'||x==='workout-notizen');
  if(cD<0||cE<0)throw new Error('format');
  const map=new Map();
  for(const r of rows.slice(1)){
    if(!r[cD]||!r[cE])continue;const en=r[cE].trim();if(/rest timer/i.test(en))continue;
    const start=parseSD(r[cD]);if(!isFinite(start)||start>=STRONG_CUTOFF)continue;
    const key=r[cD]+'|'+(cW>=0?r[cW]:'');
    let w=map.get(key);if(!w){w={id:'imp-'+hash(key),name:((cW>=0&&r[cW])||'Training').replace(/\s+/g,' ').trim(),start,end:start+parseDur(cDur>=0?r[cDur]:''),exercises:[],imported:true};map.set(key,w)}
    if(cWN>=0&&r[cWN]&&r[cWN].trim()&&!w.note)w.note=unesc(r[cWN]);
    let ex=w.exercises.find(x=>x.name===en);if(!ex){ex={name:en,rest:S.restDefault,sets:[]};w.exercises.push(ex)}
    const so=cS>=0?String(r[cS]||'').trim():'';const sec=cSec>=0?num(r[cSec]):0;
    if(/ruhe|rest/i.test(so)){const l=ex.sets[ex.sets.length-1];if(l&&sec)l.rest=Math.round(sec);continue}
    if(cN>=0&&r[cN]&&r[cN].trim()&&!ex.note)ex.note=unesc(r[cN]);
    let kg=cKg>=0?num(r[cKg]):0,reps=cR>=0?num(r[cR]):0;

  }

}

 S.gear={...(d.gear||{}),...(S.gear||{})};if(!S.goal&&d.goal)S.goal=d.goal;S.seeded=[...new Set([...(S.seeded||[]),...(d.seeded||[])])];
 if(refs){saveMeta();for(const w of d.workouts)saveWorkout(w);for(const b of (d.body||[]))saveBody(bm.get(b.date))}else lsSave();
 closeSheet&&closeSheet();renderMain();toast(`Backup geladen: ${nw} neue Trainings, ${d.routines.length} Routinen`)}
$('#bkIn').addEventListener('change',async e=>{const f=e.target.files&&e.target.files[0];e.target.value='';if(!f)return;try{await backupIn(JSON.parse(await f.text()))}catch(err){toast('Das ist keine REPIT-Backup-Datei.')}});
/* ---------- Abo-Stufen (vorbereitet, PAYWALL=false = alles frei) ---------- */
const PAYWALL=false;
const TIERS={free:{n:'Kostenlos',r:0,p:'0'},pro:{n:'REPIT Pro',r:1,p:'20 / Jahr'},coach:{n:'REPIT Coach',r:2,p:'80 / Jahr'}};
const FREE_MAX=2;
function tier(){if(!PAYWALL)return 'coach';let t='free';try{t=localStorage.getItem('hantelbuch.tier')||'free'}catch(e){}return TIERS[t]?t:'free'}
function ownCount(){return S.routines.filter(r=>r.folder!=='coach').length}
function need(t,why){if(TIERS[tier()].r>=TIERS[t].r)return true;S.payWhy=why||'';S.payNeed=t;openSheet({type:'pay'});return false}
function needSlot(n,why){if(tier()!=='free'||ownCount()+(n||1)<=FREE_MAX)return true;return need('pro',why||`In der kostenlosen Version hast du ${FREE_MAX} Trainingstage. Mit Pro bekommst du unbegrenzt viele.`)}
function sPay(){const cur=tier(),nd=S.payNeed||'pro';const row=(k,feat)=>`<div class="card" style="margin-bottom:10px;${k===nd?'border-color:rgba(201,162,74,.75);box-shadow:0 0 18px rgba(201,162,74,.2)':''}"><div class="spread"><b>${TIERS[k].n}</b><span style="color:var(--gold-hi);font-weight:800">${TIERS[k].p==='0'?'Gratis':'CHF/€ '+TIERS[k].p}</span></div><div class="mini" style="margin-top:6px;line-height:1.55">${feat.map(f=>'· '+esc(f)).join('<br>')}</div>${cur===k?'<div class="mini" style="margin-top:6px;color:var(--gold)">Dein aktuelles Abo</div>':''}</div>`;
 return `<div class="spread"><h2>REPIT Abo</h2><button class="btn text sm" data-act="close">Schliessen</button></div>
 ${S.payWhy?`<p class="mini" style="margin:6px 0 12px">${esc(S.payWhy)}</p>`:''}
 ${row('free',[FREE_MAX+' eigene Trainingstage, jeden Tag trainierbar','Verlauf, Rekorde, Körper','Einzelne Tage teilen'])}
 ${row('pro',['Unbegrenzt Trainingstage','6er-Split-Vorlage','Alles aus Kostenlos','oder CHF/€ 3 pro Monat (36 im Jahr)'])}
 ${row('coach',['Alles aus Pro','Bereich für Kunden-Pläne','Ganze Splits teilen (Datei oder Link)','Gewichts-Rechner für Kunden'])}
 <button class="btn gold full" disabled style="opacity:.6">Kaufen – bald verfügbar</button>`}
(function(){const wrap=(k,g)=>{const o=ACT[k];if(o)ACT[k]=(el)=>{if(g(el))return o(el)}};
 wrap('r-new',()=>needSlot(1));
 wrap('h-routine',()=>needSlot(1));
 wrap('tpl-open',()=>need('pro','Die 6er-Split-Vorlage hat 6 Trainingstage. Dafür brauchst du REPIT Pro.'));
 wrap('rf',(el)=>el.dataset.v!=='coach'||need('coach','Der Bereich für Kunden-Pläne gehört zu REPIT Coach.'));
 wrap('calc-on',()=>need('coach','Der Gewichts-Rechner für Kunden gehört zu REPIT Coach.'));
 const sh=()=>{const sel=S.shareSel||(S.tab==='routinen'?myRoutines():S.routines).map(r=>r.id);return sel.length<=1||need('coach','Einzelne Tage teilen kann jeder. Einen ganzen Split mit mehreren Tagen teilen geht mit REPIT Coach.')};
 wrap('share-file',sh);wrap('share-link',sh);
 wrap('plan-take',()=>needSlot((S.sheet&&S.sheet.pl&&S.sheet.pl.routines.length)||1,`Dieser Plan hat mehrere Trainingstage. In der kostenlosen Version hast du ${FREE_MAX}. Mit Pro bekommst du unbegrenzt viele.`));
 wrap('pay-open',()=>true);
})();

init();
</script>
