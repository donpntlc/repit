<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="SOL-GYM">
<meta name="theme-color" content="#0b0b0c">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Manrope:wght@500;600&display=swap" rel="stylesheet">
<title>SOL-GYM</title>
<!-- SOL-GYM: Hülle um PREPIT (/sol-tracker/) und REPIT (/repit/).
     Beide Apps laufen unverändert in je einem Rahmen. Version: SOLGYM_V -->
<style>
:root{--bg:#0b0b0c;--card:#141416;--gold:#c9a24a;--gold-hi:#e7c66d;--muted:#8a8a8f;--line:#232326}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:#fff;overflow:hidden;
  font-family:'Barlow Condensed','Arial Narrow',sans-serif}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
header{flex:none;padding:calc(env(safe-area-inset-top) + 6px) calc(env(safe-area-inset-right) + 14px) 8px calc(env(safe-area-inset-left) + 14px);
  display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line);background:var(--bg)}
.logo{font-weight:800;font-size:24px;letter-spacing:.5px;line-height:1;user-select:none;background:none;border:0;color:#fff;padding:0;font-family:inherit;cursor:pointer}
.logo b{color:var(--gold);font-weight:800}
.seg{margin-left:auto;display:flex;background:#151517;border:1px solid var(--line);border-radius:11px;padding:3px}
.seg button{appearance:none;border:0;background:transparent;color:var(--muted);font:inherit;font-weight:700;
  font-size:16px;letter-spacing:.6px;padding:7px 14px;border-radius:8px;cursor:pointer;min-width:84px}
.seg button.on{background:#232326;color:#fff}
.seg button.on .it{color:var(--gold)}
main{flex:1;position:relative;background:#000}
iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:0;background:var(--bg);display:none}
iframe.on{display:block}
#f-prep{height:calc(100% - var(--sab,0px))}

/* Startseite */
#home{position:fixed;inset:0;z-index:10;background:var(--bg);display:flex;flex-direction:column;
  padding:calc(env(safe-area-inset-top) + 56px) calc(env(safe-area-inset-right) + 24px) calc(env(safe-area-inset-bottom) + 28px) calc(env(safe-area-inset-left) + 24px);
  transition:opacity .25s ease}
#home.hide{opacity:0;pointer-events:none}
.hlogo{font-weight:800;font-size:64px;line-height:.9;letter-spacing:.5px}
.hlogo b{color:var(--gold);font-weight:800}
.hsub{font-family:Manrope,system-ui,sans-serif;font-weight:500;color:var(--muted);font-size:15px;margin-top:12px;letter-spacing:.2px}
.hq{font-family:Manrope,system-ui,sans-serif;font-weight:600;font-size:13px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin:auto 0 14px}
.pick{appearance:none;text-align:left;width:100%;display:flex;align-items:center;gap:16px;background:var(--card);border:1px solid var(--line);
  border-radius:18px;padding:22px 20px;margin-bottom:12px;color:#fff;cursor:pointer;font-family:inherit}
.pick:active{border-color:var(--gold);background:#1a1a1c}
.pick .t{font-weight:800;font-size:34px;line-height:1;letter-spacing:.5px}
.pick .t .it{color:var(--gold)}
.pick .d{font-family:Manrope,system-ui,sans-serif;font-weight:500;font-size:14px;color:var(--muted);margin-top:6px}
.pick .ar{margin-left:auto;color:var(--gold);font-size:28px;font-weight:700}
.slogan{font-weight:700;font-size:15px;letter-spacing:2.5px;color:#555;margin-top:18px;text-transform:uppercase}
#probe{position:fixed;bottom:0;left:0;width:0;height:env(safe-area-inset-bottom,0px);visibility:hidden}
</style>
</head>
<body>
<div id="probe"></div>
<div id="app">
  <header>
    <button class="logo" data-home title="Zur Startseite">SOL<b>-GYM</b></button>
    <nav class="seg" role="tablist">
      <button data-tab="prep" role="tab">PREP<span class="it">IT.</span></button>
      <button data-tab="rep" role="tab">REP<span class="it">IT.</span></button>
    </nav>
  </header>
  <main>
    <iframe id="f-prep" title="PREPIT – Ernährung" allow="clipboard-write; web-share; autoplay"></iframe>
    <iframe id="f-rep" title="REPIT – Training" allow="clipboard-write; web-share; autoplay"></iframe>
  </main>
</div>

<section id="home">
  <div class="hlogo">SOL<b>-GYM</b></div>
  <div class="hsub">Ernährung und Training in einer App.</div>
  <div class="hq">Was möchtest du öffnen?</div>
  <button class="pick" data-tab="prep">
    <div><div class="t">PREP<span class="it">IT.</span></div><div class="d">Ernährung · Mahlzeiten · Makros</div></div>
    <span class="ar">›</span>
  </button>
  <button class="pick" data-tab="rep">
    <div><div class="t">REP<span class="it">IT.</span></div><div class="d">Training · Routinen · Fortschritt</div></div>
    <span class="ar">›</span>
  </button>
  <div class="slogan">Prep it. Rep it. Track it.</div>
</section>

<script>
var SOLGYM_V='29.10. 20:45';
var SRC={prep:'../../sol-tracker/',rep:'../'};
var KEY='solgym.tab';
var SAB=0;
function get(k){try{return localStorage.getItem(k)}catch(e){return null}}
function set(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function measure(){
  SAB=document.getElementById('probe').getBoundingClientRect().height||0;
  document.documentElement.style.setProperty('--sab',SAB+'px');
  passSab(document.getElementById('f-rep'));
}
// REPIT bekommt den Abstand zum Home-Balken, damit die Leiste unten bündig sitzt.
function passSab(f){try{if(f&&f.contentDocument&&f.contentDocument.documentElement)
  f.contentDocument.documentElement.style.setProperty('--sab',SAB+'px')}catch(e){}}
function load(t){var f=document.getElementById('f-'+t);if(!f.src){f.src=SRC[t];if(t==='rep')f.addEventListener('load',function(){passSab(f)})}return f}
function show(t){
  if(!SRC[t])t='rep';
  load(t);
  ['prep','rep'].forEach(function(x){
    document.getElementById('f-'+x).classList.toggle('on',x===t);
    var b=document.querySelector('.seg [data-tab="'+x+'"]');
    b.classList.toggle('on',x===t);b.setAttribute('aria-selected',x===t);
  });
  set(KEY,t);
  document.getElementById('home').classList.add('hide');
}
document.querySelectorAll('[data-tab]').forEach(function(b){
  b.addEventListener('click',function(){show(b.dataset.tab)});
});
document.querySelector('[data-home]').addEventListener('click',function(){
  document.getElementById('home').classList.remove('hide');
});
measure();addEventListener('resize',measure);
var h=(location.hash||'').replace('#','');
if(SRC[h])show(h);
// Beide Bereiche schon hinter der Startseite laden, damit sie sofort offen sind.
load(get(KEY)==='prep'?'prep':'rep');
setTimeout(function(){load('prep');load('rep')},800);
</script>
</body>
</html>
