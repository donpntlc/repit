<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="SOL-GYM">
<meta name="theme-color" content="#0b0b0c">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&display=swap" rel="stylesheet">
<title>SOL-GYM</title>
<!-- SOL-GYM: Hülle um PREPIT (/sol-tracker/) und REPIT (/repit/).
     Beide Apps laufen unverändert in je einem Rahmen. Version: SOLGYM_V -->
<style>
:root{--bg:#0b0b0c;--gold:#c9a24a;--gold-hi:#e7c66d;--muted:#8a8a8f;--line:#232326}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:#fff;overflow:hidden;
  font-family:'Barlow Condensed','Arial Narrow',sans-serif}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
header{flex:none;padding:calc(env(safe-area-inset-top) + 6px) calc(env(safe-area-inset-right) + 14px) 8px calc(env(safe-area-inset-left) + 14px);
  display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line);background:var(--bg)}
.logo{font-weight:800;font-size:24px;letter-spacing:.5px;line-height:1;user-select:none}
.logo b{color:var(--gold);font-weight:800}
.seg{margin-left:auto;display:flex;background:#151517;border:1px solid var(--line);border-radius:11px;padding:3px}
.seg button{appearance:none;border:0;background:transparent;color:var(--muted);font:inherit;font-weight:700;
  font-size:16px;letter-spacing:.6px;padding:7px 14px;border-radius:8px;cursor:pointer;min-width:84px}
.seg button .it{color:inherit}
.seg button.on{background:#232326;color:#fff}
.seg button.on .it{color:var(--gold)}
main{flex:1;position:relative;padding-bottom:env(safe-area-inset-bottom);background:#000}
iframe{position:absolute;top:0;left:0;width:100%;height:calc(100% - env(safe-area-inset-bottom));border:0;background:var(--bg);display:none}
iframe.on{display:block}
#ver{position:absolute;left:14px;bottom:2px;font:11px system-ui;color:#555;pointer-events:none}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="logo" title="SOL-GYM">SOL<b>-GYM</b></div>
    <nav class="seg" role="tablist">
      <button data-tab="prep" role="tab">PREP<span class="it">IT.</span></button>
      <button data-tab="rep" role="tab">REP<span class="it">IT.</span></button>
    </nav>
  </header>
  <main>
    <iframe id="f-prep" title="PREPIT – Ernährung" allow="clipboard-write; web-share; autoplay"></iframe>
    <iframe id="f-rep" title="REPIT – Training" allow="clipboard-write; web-share; autoplay"></iframe>
  </main>
</div>
<script>
var SOLGYM_V='29.10. 19:30';
var SRC={prep:'../../sol-tracker/',rep:'../'};
var KEY='solgym.tab';
function get(k){try{return localStorage.getItem(k)}catch(e){return null}}
function set(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function load(t){var f=document.getElementById('f-'+t);if(!f.src)f.src=SRC[t];return f}
function show(t){
  if(!SRC[t])t='rep';
  load(t);
  ['prep','rep'].forEach(function(x){
    document.getElementById('f-'+x).classList.toggle('on',x===t);
    var b=document.querySelector('[data-tab="'+x+'"]');
    b.classList.toggle('on',x===t);b.setAttribute('aria-selected',x===t);
  });
  set(KEY,t);
}
document.querySelectorAll('[data-tab]').forEach(function(b){
  b.addEventListener('click',function(){show(b.dataset.tab)});
});
var start=(location.hash||'').replace('#','')||get(KEY)||'rep';
show(start);
// Den anderen Bereich kurz danach im Hintergrund laden, damit das Wechseln sofort geht.
setTimeout(function(){load(start==='rep'?'prep':'rep')},1500);
</script>
</body>
</html>
